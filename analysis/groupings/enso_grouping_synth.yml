    label: "Group A (Astoria, Brindlemark)"
    short: "A"
    short_fig: "A"
    colour: "#1b9e77"
    centroid_short: "GA"
    centroid_label: "Group A"
  grp_b:
    label: "Group B (Calderon, Dunmore)"
    short: "B"
    short_fig: "B"
    colour: "#7570b3"
    centroid_short: "GB"
    centroid_label: "Group B"

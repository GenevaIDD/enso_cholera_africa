  outputs:
    - "analysis/groupings/<deploy.grouping>.csv + .yml (provenance header: deploy, batch, cell, chains, fit sha256)"
    - "generated_data/kl_groupings/<deploy.grouping>_membership.csv"
  note: "--stage gen_grouping (deploy.kl_sweep.batch set): the fit registry from the pinned cell deploy.kl_sweep.cell, each country in its class of maximum mean posterior probability (utils/kl_grouping.R, the make_kl_grouping.R body). The cell is never chosen automatically; its chains are the comparison's agreeing chains (kl_sweep.chains: agree; the comparison must have been run with the deploy's kl_sweep.n_agree / mode_tol: dominant mode, or the N best-agreeing chains) or a fixed list; deploy.fits.groups must name exactly the derived groups. Under deploy.convergence.action warn | refuse it prints the cell's all-chain and agreeing-chain diagnostics (kl_grouping.R::kl_grouping_convergence()) and, under refuse, refuses when fewer than 2 chains agree or the agreeing-chain R-hat exceeds 1.05 (warns beyond 1.01 / 400). Absent -> written, identical -> left, different -> refused unless --force. Consumed by deploy:gen_batches (the fit dirs) and every later deploy stage; first step of the `fits` phase of tools/run_pipeline.sh, after the `classes` phase (04_fit_kl.sh --deploy --postprocess)."


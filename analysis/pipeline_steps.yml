  note: "brms_kl class-sweep comparison: chain modes, agreeing chains, R-hat / ESS, country-block LOO + stacking weights, MAP partitions, membership uncertainty (responsibility matrix, M1 country mixture, partition stability). Read by 06_fit_figures_kl_sweep.R, deploy:gen_grouping and 09 report_kl_sweep (results.kl_sweep_dir)."


# analysis/pipeline_steps.yml — the machine-readable run graph of the pipeline.
#
# Single source of truth for analysis/PIPELINE.md's step table and for
# notebooks/pipeline_run_graph.dot. Both are GENERATED from this file by
#
#   Rscript analysis/utils/make_pipeline_docs.R            # rewrite both
#   Rscript analysis/utils/make_pipeline_docs.R --check    # exit 1 if either is stale
#
# and analysis/tests/test_pipeline_doc_coverage.R (HARD gate) fails when a
# numbered script or a tier-1 stage driver is missing here, when an entry names
# a file that does not exist, when the list order below is not a valid run order
# of the `after` edges, or when either generated file is stale.
#
# LIST ORDER IS RUN ORDER. Phase numbers are identifiers, not run order:
# on the spatPomp path 08 (smoothing) runs
# BEFORE 07b (forecast/hindcast), and the deploy tool runs at several points
# between 05 and 07. The test checks that every `after` / `dispatched_by` entry
# appears earlier in the list.
#
# Fields
#   id            unique key. For a numbered step: its filename. For a non-step
#                 tool: its utils/ path, or `deploy:<stage>` for one stage of
#                 utils/deploy_prod_run.R.
#   file          path relative to analysis/ (must exist)
#   kind          step | tool | report
#   phase         two-digit phase ("00".."11"); "--" for tools
#   track         data | pop | occ | siz | dur | mon | all | sim | results
#   rollout       core (part of every prod_run<N> rollout) | optional
#                 (benchmarks, sensitivity, diagnostics, the v1 simulator)
#   runs          local | slurm | local+slurm
#   after         ids this step consumes artefacts from (data dependencies)
#   dispatched_by id of the dispatcher that routes to this worker, if any
#   drivers       bash drivers (relative to analysis/bash/) that run it
#   inputs        external inputs not produced by any step (optional)
#   outputs       what it writes (paths relative to the repo root)
#   note          one line; optional

steps:

# --- 00 ingest ---------------------------------------------------------------
- id: 00_ingest_outbreakextractr.R
  file: 00_ingest_outbreakextractr.R
  kind: step
  phase: "00"
  track: data
  rollout: core
  runs: local+slurm
  after: []
  drivers: [stages/00_ingest.sh, campaigns/preprocess.sh]
  inputs:
    - "OutbreakExtractR outputs: combined_outbreaks_cholera.csv + stage1_geo_*.geojson"
  outputs:
    - "~/secure/cholera_outbreak_data/outbreak_data_<Mon_YYYY>/time_series_{preoutbreak,outbreak}_extraction.rds"
    - "~/secure/cholera_outbreak_data/outbreak_data_<Mon_YYYY>/outbreak_shapefiles.rds"
    - "generated_data/prep_counts/00_ingest_outbreakextractr.yml (cascade counts)"
  note: "Run when the outbreak data are refreshed; AFR/EMR filter (the >=50-case filter is upstream, in OutbreakExtractR). Writes into the vintage folder (--outdir defaults to --indir = paths.R::defaultOutbreakDataDir())."

- id: 00_ingest_synthetic.R
  file: 00_ingest_synthetic.R
  kind: step
  phase: "00"
  track: data
  rollout: optional
  runs: local
  after: []
  drivers: [tools/run_synthetic_pipeline.sh]
  inputs:
    - "analysis/groupings/synthetic_countries.csv (fake countries, ISO 3166 user-assigned codes XA?)"
  outputs:
    - "$CHOLERA_OUTBREAK_DATA_DIR/outbreak_data_<Mon_YYYY>/combined_outbreaks_cholera.csv + stage1_geo/*.geojson (the input of 00_ingest_outbreakextractr.R)"
    - "data/geodata/{gadm_410-levels,gadm_valid}.gpkg, basemap shapefiles; data/climate_parquet/; data/worldpop/ + data/country_boundaries/"
    - "data/who_annual_report_africa/, data/best_seasonality_estimates.csv, data/hmm_country_clusters.csv, data/lenssen/extracted/, C3S plume stand-in"
    - "generated_data/enso_*_cache.rds, generated_data/wpp2024_national_totals.csv, generated_data/synthetic_world/{truth.yml,epidemics.rds}"
  note: "The synthetic world: every raw input in the format of the real source, simulated with known ENSO effects (utils/synthetic_world.R), so the real 00 -> 11 steps run without the restricted data. Runs only with CHOLERA_OUTBREAK_DATA_DIR set inside a sandbox (never ~/secure/); tools/run_synthetic_pipeline.sh chains every step on it with the deploy configs/deploy/synth_run1.yml."

# --- 01 preprocess outbreaks -------------------------------------------------
- id: 01_preprocess_outbreaks.R
  file: 01_preprocess_outbreaks.R
  kind: step
  phase: "01"
  track: data
  rollout: core
  runs: local+slurm
  after: [00_ingest_outbreakextractr.R]
  drivers: [stages/01_preprocess.sh, campaigns/preprocess.sh]
  outputs:
    - "~/secure/cholera_outbreak_data/outbreak_metadata.rds"
    - "~/secure/cholera_outbreak_data/aggregated{,_admin_level}_ts_preoutbreak_extraction.rds"
    - "~/secure/cholera_outbreak_data/outbreak_data_<Mon_YYYY>/outbreak_shapefiles.gpkg"
    - "generated_data/prep_counts/01_preprocess_outbreaks.yml (cascade counts)"
    - "figures/outbreak_map.png (-f TRUE; the Slurm stage passes -f FALSE)"

- id: 01_preprocess_national_zero_months.R
  file: 01_preprocess_national_zero_months.R
  kind: step
  phase: "01"
  track: data
  rollout: core
  runs: local+slurm
  after: [01_preprocess_outbreaks.R]
  drivers: [stages/01_preprocess.sh, campaigns/preprocess.sh]
  outputs:
    - "~/secure/cholera_outbreak_data/national_zero_months.rds"
    - "~/secure/cholera_outbreak_data/national_zero_months_t<N>.rds"
    - "~/secure/cholera_outbreak_data/national_zero_months[_t<N>][_<rule>].audit.csv"
    - "~/secure/cholera_outbreak_data/national_zero_months[_t<N>]_db_who_consistency.csv"
  note: "National (ADM0) + WHO annual zeros -> country-months the coverage mask (coverage.R::build_coverage_mask) counts as observed 0 for every gid. --zero_threshold N (e.g. 60) adds WHO country-years under N cases (last --window months only if the next year is also under N; database-vs-WHO inconsistent years left out) as national_zero_months_t<N>.rds. --rule <name> (analysis/national_zero_rules.yml; r2 = head guard, consistency scope all, ETH 2010-2016) writes national_zero_months[_t<N>]_<name>.rds; every run writes the audit (<months>.audit.csv) and the database-vs-WHO table beside the months. The Slurm stage builds the deploy's deploy.episodes rule."

- id: 01b_preprocess_outbreaks_monthly.R
  file: 01b_preprocess_outbreaks_monthly.R
  kind: step
  phase: "01"
  track: mon
  rollout: core
  runs: local+slurm
  after: [00_ingest_outbreakextractr.R, 01_preprocess_outbreaks.R]
  drivers: [stages/01_preprocess.sh, campaigns/preprocess.sh]
  outputs:
    - "~/secure/cholera_outbreak_data/outbreak_monthly_cases.rds"
  note: "Month-grain re-aggregation of the same raw series; response of the monthly track. Gate B reads 01's outbreak metadata."

- id: 01_preprocess_figures_data_overview.R
  file: 01_preprocess_figures_data_overview.R
  kind: step
  phase: "01"
  track: data
  rollout: optional
  runs: local
  after: [00_ingest_outbreakextractr.R, 01_preprocess_outbreaks.R]
  outputs:
    - "figures/data_overview/"
  note: "Manuscript Figure 1 (data overview). Reads 01's outbreak_shapefiles.gpkg."

# --- 02 preprocess population / crosswalk / climate --------------------------
- id: utils/preprocess_paths.R
  file: utils/preprocess_paths.R
  kind: tool
  phase: "--"
  track: data
  rollout: core
  runs: local+slurm
  after: []
  drivers: [stages/01_preprocess.sh, campaigns/preprocess.sh]
  outputs:
    - "KEY=value on stdout: OUTBREAK_VINTAGE / VINTAGE_DIR / SECURE_ROOT, NZ_RULE / NZ_THRESHOLD (--deploy), SEC= / GEN= output list (--outputs)"
  note: "Bash reads the data-leg paths and the deploy's national-zero rule here; it never names the vintage."

- id: 02a_preprocess_population_tasks.R
  file: 02a_preprocess_population_tasks.R
  kind: step
  phase: "02"
  track: pop
  rollout: core
  runs: local
  after: [00_ingest_outbreakextractr.R]
  drivers: [stages/02_population.sh]
  outputs:
    - "task YAMLs, per country (--task_unit country) or per (country, year) (TASKS_DIR= / N_TASKS= on stdout)"
  note: "Login node; the national-boundary cache and the WorldPop rasters are downloaded before the 02b array (stages/02_population.sh checks the boundary cache)."

- id: 02b_preprocess_population_run.R
  file: 02b_preprocess_population_run.R
  kind: step
  phase: "02"
  track: pop
  rollout: optional
  runs: local+slurm
  after: [02a_preprocess_population_tasks.R]
  drivers: [stages/02_population.sh]
  inputs:
    - "WorldPop constrained rasters; national boundaries"
  outputs:
    - "generated_data/population/parts/iso3=<ISO3>/year=<YYYY>/"
  note: "Per-(country, year) runner (stages/02_population.sh --task-unit country_year), kept beside the per-country one."

- id: 02b_preprocess_population_run_country.R
  file: 02b_preprocess_population_run_country.R
  kind: step
  phase: "02"
  track: pop
  rollout: core
  runs: local+slurm
  after: [02a_preprocess_population_tasks.R]
  drivers: [stages/02_population.sh, campaigns/preprocess.sh]
  inputs:
    - "WorldPop constrained rasters (prestaged); national boundaries"
  outputs:
    - "generated_data/population/parts/iso3=<ISO3>/year=<YYYY>/ (same partitions as 02b_preprocess_population_run.R)"
    - "generated_data/population/gid_pop_cache/iso3=<ISO3>/year=<YYYY>.qs (Q_g, independent of the outbreak vintage)"
  note: "One task per country, all years: geometry once, Q_g reused across vintages. A partition is skipped only when built from the current LP corpus (popPartFresh)."

- id: 02c_preprocess_population_compile.R
  file: 02c_preprocess_population_compile.R
  kind: step
  phase: "02"
  track: pop
  rollout: core
  runs: local+slurm
  after: [02b_preprocess_population_run_country.R]
  drivers: [stages/02_population.sh, campaigns/preprocess.sh]
  outputs:
    - "generated_data/population_crosswalk_<Y0>-<Y1>.qs"
    - "generated_data/gid_population_<Y0>-<Y1>.qs"
    - "generated_data/population_qc/"
  note: "The stage driver submits it afterok on the array."

- id: 02_preprocess_crosswalk.R
  file: 02_preprocess_crosswalk.R
  kind: step
  phase: "02"
  track: pop
  rollout: core
  runs: local+slurm
  after: [00_ingest_outbreakextractr.R, 01_preprocess_outbreaks.R, 02c_preprocess_population_compile.R]
  drivers: [stages/02_crosswalk.sh, campaigns/preprocess.sh]
  outputs:
    - "generated_data/matched_ob_gids_crosswalk.rds"
    - "generated_data/u_gids_crosswalk.rds"
    - "generated_data/prep_counts/02_preprocess_crosswalk.yml (cascade counts)"
  note: "Reads 01's outbreak_shapefiles.gpkg (attributes)."

- id: 02_preprocess_climate.R
  file: 02_preprocess_climate.R
  kind: step
  phase: "02"
  track: data
  rollout: core
  runs: local+slurm
  after: [00_ingest_outbreakextractr.R, 01_preprocess_outbreaks.R, 02_preprocess_crosswalk.R]
  drivers: [stages/02_climate.sh, campaigns/preprocess.sh]
  inputs:
    - "data/climate_parquet/ (tools/download_jahn2026_parquet.sh) or data/climate_data/ (CHIRPS / ERA5-Land CSV, --climate_source csv)"
  outputs:
    - "generated_data/matched_ob_gids.rds (--stage match)"
    - "generated_data/climate_stats/ per-gid caches (--stage extract)"
    - "generated_data/climate_stats.sqlite, generated_data/climate_extremes.sqlite (--stage db)"
  note: "Defaults = the deployed build (parquet, crosswalk gids, dynamic weighting); a database of other provenance is not overwritten without --force. Reads 01's outbreak_shapefiles.gpkg."

# --- 03 prepare model datasets -----------------------------------------------
- id: 03_prepare_occ.R
  file: 03_prepare_occ.R
  kind: step
  phase: "03"
  track: occ
  rollout: core
  runs: local+slurm
  after: [01_preprocess_outbreaks.R, 01_preprocess_national_zero_months.R, 02_preprocess_climate.R, 02c_preprocess_population_compile.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/outbreaks_survival_data_base-<baseline>.rds"
    - "generated_data/matched_ob_gids_seasonality_occ.rds"
    - "generated_data/outbreaks_survival_data_base-<baseline><variant>.lp_members.csv"
    - "generated_data/outbreaks_survival_data_base-<baseline><variant>.{adm1_overlap,discarded_onsets,adm0_dropped,masked_rows}.csv"
    - "generated_data/outbreaks_survival_data_base-<baseline><variant>.contagion_coverage.csv"
  note: "Refuses to overwrite an existing panel whose prep stamp differs (any field but stamped_at) unless --force. --national_zero_fill (gid_season only) reads 01_preprocess_national_zero_months.R's output and writes the _nz panel; with --national_zero_threshold N it reads the _t<N> months and writes the _nz<N> panel."

- id: 03_prepare_siz.R
  file: 03_prepare_siz.R
  kind: step
  phase: "03"
  track: siz
  rollout: core
  runs: local+slurm
  after: [01_preprocess_outbreaks.R, 02_preprocess_climate.R, 02c_preprocess_population_compile.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/outbreak_size_analysis_data*.rds"
    - "generated_data/outbreak_footprint_members*.rds"
    - "generated_data/matched_ob_gids_seasonality_siz.rds"
  note: "Refuses to overwrite an existing size frame or footprint map whose prep stamp differs (any field but stamped_at) or that has none, unless --force (the matched_ob_gids_seasonality_siz.rds cache is written before the guard)."

- id: 03_prepare_dur.R
  file: 03_prepare_dur.R
  kind: step
  phase: "03"
  track: dur
  rollout: core
  runs: local+slurm
  after: [03_prepare_siz.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/outbreaks_duration_data_base-<baseline>*.rds"
  note: "Refuses to overwrite an existing panel whose prep stamp differs (any field but stamped_at / restamped_at) or that has none, unless --force."

- id: 03_prepare_mon.R
  file: 03_prepare_mon.R
  kind: step
  phase: "03"
  track: mon
  rollout: core
  runs: local+slurm
  after: [03_prepare_dur.R, 01b_preprocess_outbreaks_monthly.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/outbreaks_monthly_data_base-<baseline>*.rds"
  note: "Refuses to overwrite an existing panel whose prep stamp differs (any field but stamped_at) or that has none, unless --force."

- id: 03_prepare_sim_panel.R
  file: 03_prepare_sim_panel.R
  kind: step
  phase: "03"
  track: sim
  rollout: core
  runs: local+slurm
  after: [03_prepare_occ.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/sim_climate_panel_base-<baseline>.rds"
  note: "Continuous per-(gid, month) historical panel (smoothing, hindcast, v1). Refuses to overwrite an existing panel whose prep stamp differs (any field but stamped_at) or that has none, unless --force; ENSO values are not in the stamp (back up and diff)."

- id: 03_prepare_who_monthly.R
  file: 03_prepare_who_monthly.R
  kind: step
  phase: "03"
  track: sim
  rollout: core
  runs: local+slurm
  after: []
  drivers: [stages/03_prepare.sh]
  inputs:
    - "data/who_annual_report_africa/who_dashboard_weekly_africa.rds"
    - "data/who_annual_report_africa/who_sitrep_cumulative_africa.csv"
  outputs:
    - "generated_data/who_dashboard_monthly_africa.rds"
    - "generated_data/who_dashboard_monthly_africa_meta.yml"
  note: "WHO dashboard national weekly counts -> monthly (day overlap), gap-filled from the WHO multi-country update cumulative snapshots (unchanged cumulative = zero only for --zero_iso3); scored by the smoothing's `_who` measurement (simulator.filter.who_obs). Refuses to overwrite an existing table whose _meta.yml (less `written` and the input mtimes) or content differs, or that has no meta, unless --force."

- id: 03_prepare_sim_panel_projection.R
  file: 03_prepare_sim_panel_projection.R
  kind: step
  phase: "03"
  track: sim
  rollout: core
  runs: local+slurm
  after: [03_prepare_occ.R]
  drivers: [stages/03_prepare.sh]
  inputs:
    - "ONI cache + NOAA CPC CFSv2 ENSO forecast"
  outputs:
    - "generated_data/sim_climate_panel_projection_base-<baseline>.rds"
  note: "Forecast-horizon panel past the climate DB's last month. Refuses to overwrite an existing panel whose prep stamp differs (any field but stamped_at) or that has none, unless --force; ENSO values are not in the stamp (back up and diff)."

- id: 03_prepare_sim_panel_extended.R
  file: 03_prepare_sim_panel_extended.R
  kind: step
  phase: "03"
  track: sim
  rollout: optional
  runs: local+slurm
  after: [03_prepare_sim_panel.R, 03_prepare_sim_panel_projection.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/sim_climate_panel_base-<baseline>[_ep-gs]_to-YYYY-MM.rds"
  note: "Historical panel + projection rows up to the latest observed ONI month: the smoothing panel when the smoothing runs to the ENSO seam. Refuses to overwrite an existing panel whose prep stamp differs (any field but stamped_at) or that has none, unless --force."

- id: 03_prepare_lenssen_analogs.R
  file: 03_prepare_lenssen_analogs.R
  kind: step
  phase: "03"
  track: sim
  rollout: core
  runs: local
  after: []
  inputs:
    - "Lenssen et al. (2024) CMIP6 piControl Nino3.4, Zenodo 10045687"
  outputs:
    - "generated_data/lenssen_nino34_analogs.rds"
    - "generated_data/lenssen_nino34_analogs_meta.yml"
  note: "ENSO analog cache for the counterfactual forecast (enso.counterfactual.scenario: lenssen). --match legacy (default) = the original matcher on the Zenodo Rdas; --match library draws the pool from generated_data/enso_continuation_library.qs, which gen_forecast / gen_events also build in-process per run under deploy.enso_counterfactual.match: library."

- id: 03_prepare_enso_cfsv2_calibration.R
  file: 03_prepare_enso_cfsv2_calibration.R
  kind: step
  phase: "03"
  track: sim
  rollout: optional
  runs: local
  after: []
  inputs:
    - "NMME CFSv2 hindcast Nino3.4 (IRIDL PENTAD_SAMPLES_FULL, archived NetCDF)"
    - "CPC detrended ERSST and OISST Nino3.4 indices"
  outputs:
    - "generated_data/enso_cfsv2_calibration.rds"
    - "generated_data/enso_cfsv2_calibration_meta.yml"
  note: "CPC-style PDF + spread correction of the CFSv2 forecast (simulator.enso.cfsv2_calibration)."

- id: 03_prepare_enso_continuation_library.R
  file: 03_prepare_enso_continuation_library.R
  kind: step
  phase: "03"
  track: sim
  rollout: optional
  runs: local
  after: []
  inputs:
    - "Lenssen et al. (2024) CMIP6 piControl Nino3.4 (data/lenssen/extracted/ or the Zenodo 10045687 zips)"
    - "ONI cache (rescale sd; --validate: the observed seams)"
  outputs:
    - "generated_data/enso_continuation_library.qs"
    - "generated_data/enso_continuation_library_meta.yml"
    - "generated_data/enso_continuation_skill.csv (--validate)"
    - "generated_data/enso_continuation_skill_meta.yml (--validate)"
  note: "Seam-agnostic k-NN analog library for ENSO past the CFSv2 span (simulator.enso.continuation.method: analog; also read by 03_prepare_sim_panel_projection.R --enso_continuation analog). --validate (no build) scores the library as deployed (--deploy's enso_continuation over the defaults) on observed seams: fair CRPS / CRPSS vs climatology and neutral by lead (utils/enso_continuation_skill.R), read by 09 for each group's continuation CRPSS."

- id: 03_prepare_rain_adm1.R
  file: 03_prepare_rain_adm1.R
  kind: step
  phase: "03"
  track: results
  rollout: core
  runs: local+slurm
  after: [02_preprocess_climate.R]
  drivers: [stages/03_prepare.sh]
  outputs:
    - "generated_data/adm1_monthly_precip.qs"
    - "generated_data/adm1_monthly_precip_meta.yml"
  note: "ADM1 x month rainfall reduced from climate_stats.sqlite (8.6 GB) for 09's rain_enso step (Figure 1c); built locally (copy the .qs to the cluster before 09 runs there) or on the cluster by stages/03_prepare.sh."

# --- fit-batch configs (non-step tools) --------------------------------------
- id: deploy:gen_batches
  file: utils/deploy_prod_run.R
  kind: tool
  phase: "--"
  track: all
  rollout: core
  runs: local
  after: []
  outputs:
    - "analysis/configs/<fits.*_dir>/*.yml + manifest.yml"
    - "analysis/configs/<kl_sweep.batch>/*.yml + manifest.yml (when the deploy derives its grouping from a kl sweep)"
  note: "--stage gen_batches: the deploy YAML's fit-batch dirs (and kl class sweep dir), from make_batch_configs.R's BATCH_REGISTRY. A sweep rollout runs it twice: the sweep dir first (the fit dirs are 'deferred' while their grouping registry is absent), then the fit dirs after deploy:gen_grouping (run_pipeline.sh phases `classes` and `fits`). A fit batch grouped by another registry than deploy.grouping is refused."

- id: utils/make_batch_configs.R
  file: utils/make_batch_configs.R
  kind: tool
  phase: "--"
  track: all
  rollout: optional
  runs: local
  after: []
  outputs:
    - "analysis/configs/<batch>/*.yml + manifest.yml"
  note: "Any registered batch outside a deploy (benchmarks, sensitivity)."

# --- 04 fit ------------------------------------------------------------------
- id: 04_fit_run.R
  file: 04_fit_run.R
  kind: step
  phase: "04"
  track: all
  rollout: core
  runs: local+slurm
  after: [deploy:gen_batches, utils/make_batch_configs.R]
  drivers: [stages/04_fit.sh, campaigns/enso_grouped_singlelag.sh, campaigns/dur_enso_grouped_singlelag.sh, campaigns/mon_enso_grouped_singlelag.sh]
  outputs:
    - "(routes to 04_fit_<track>_<backend>.R from the config's <track>.backend)"
  note: "Dispatcher; slurm/submit_fit.sh runs it, then 05_fit_postprocess.R."

- id: 04_fit_occ_brms_cb.R
  file: 04_fit_occ_brms_cb.R
  kind: step
  phase: "04"
  track: occ
  rollout: core
  runs: local+slurm
  after: [03_prepare_occ.R]
  dispatched_by: 04_fit_run.R
  outputs:
    - "generated_data/ occurrence fit + cb_meta (makeRunFile)"

- id: 04_fit_occ_brms_kl.R
  file: 04_fit_occ_brms_kl.R
  kind: step
  phase: "04"
  track: occ
  rollout: optional
  runs: local+slurm
  after: [03_prepare_occ.R]
  dispatched_by: 04_fit_run.R
  drivers: [stages/04_fit_kl.sh]
  outputs:
    - "generated_data/ occurrence fit + kl_meta + kl_summary (+ kl_resp, kl_comembership, kl_partition for latent classes; kl_pin_plan, kl_pin + per-order _arrNN fits under kernel.pin) (makeRunFile)"
  note: "ENSO lag kernel / latent country classes (utils/dlnm_kernel.R). A config batch (e.g. the class sweep kl_sweep_classes_prodtu_all, utils/make_batch_configs.R) on SLURM: stages/04_fit_kl.sh (array, -c 32 / 96G; --postprocess chains 05_fit_postprocess_kl_sweep.R; --deploy reads the batch from deploy.kl_sweep.batch and the comparison's chain selection from kl_sweep.n_agree / mode_tol)."

- id: 04_fit_siz_brms_cb.R
  file: 04_fit_siz_brms_cb.R
  kind: step
  phase: "04"
  track: siz
  rollout: core

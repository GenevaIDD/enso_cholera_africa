# config_defaults.yml — Default parameters for the cholera pipeline
#
# The runtime defaults are get_default_options() (analysis/utils/config.R);
# this file restates their key paths and values (HARD gate
# analysis/tests/test_config_defaults_parity.R) and is the base every
# config generated by analysis/utils/make_batch_configs.R starts from.
#
# Schema: top-level shared keys + exactly one model block in real configs.
# This defaults file carries both `occurrence:` and `size:` for completeness;
# real run configs carry only one.
#
# Convention 2 (occurrence + size): active slope RE flags imply the
# corresponding climate fixed effect. `occurrence.covariates` is the
# escape hatch for fixed effects that have no slope:
#   time_to_last_outbreak_cat, ongoing_outbreak_lag1, enso, months, quarter.
#
# Dispatcher: Rscript analysis/04_fit_run.R -C analysis/configs/<batch>/<run>.yml
# Routes on which model block is present × its `backend:` field.

# ---------------------------------------------------------------------------
# TOP LEVEL — shared scope / data-prep / IO
# ---------------------------------------------------------------------------
baseline:  "1990_2019"    # baseline climate window (used in data filenames)
country:   "all"          # ISO3 | comma-separated ISOs | "all"
TL:        "1970-01-01"   # left truncation date (YYYY-MM-DD)
TR:        "2024-12-31"   # right censoring date (YYYY-MM-DD)
seed:      1234
outdir:    "generated_data/"
overwrite: false

# ENSO data-prep parameters — shared by both models
# enso_lag{N} columns (N = 0..12) are always written by 03_ and 06_.
# Whether the model uses enso_lag{lag_months} as a fixed effect is
# controlled by occurrence.covariates.enso / size.covariates.enso.
# Slope REs use concrete keys: re_*_enso_lag{N}_slope.
enso:
  lag_months: 11            # which lag column to use in the formula (0..12)
  source:     "oni"         # "oni" (primary) | "roni" | "nino34" (sensitivity)
  cache_dir:  "generated_data/"

# Distance-weighted neighbour contagion (shared), the continuous replacement for
# the coarse ongoing_outbreak_country_lag1 / _tu_lag1 spillover indicators:
#   nbr_rho(i,t) = sum_{j != i} active_j(t-1) * exp(-d_ij / rho)
# built at ADM1 grain (ADM2 survival rows inherit their parent ADM1's value) and
# materialised by 03_prepare_occ.R as nbr_lag1_r{200,500}[_rn]. Split top-level
# for the same reason `enso` is: the prep script has no occurrence: block, the
# formula builder does. Whether the column enters the formula is controlled by
# occurrence.covariates.nbr_contagion_lag1; the keys here only choose WHICH of
# the materialised columns that toggle selects.
contagion:
  rho_km:    500                          # decay bandwidth; must match a prepped column
  scale:     "raw"                        # "raw" | "rownorm" (the _rn sibling)
  partition: "none"                       # "none" | "group": neighbours + denominator limited to the
                                          # unit's grouping.source group (the _pg sibling; needs
                                          # 03_prepare_occ.R --contagion_partition_source <source>)
                                          # | "registry": limited to the unit's group in the registry
                                          # partition_source (the _part<token> sibling; needs that
                                          # registry in --contagion_partition_source)
  partition_source: ""                    # registry for partition: "registry" ("" otherwise)
  gadm_path: "data/geodata/gadm_valid.gpkg"  # ADM1 centroid source for the kernel
  refresh:   false                        # rebuild the cached ADM1 distance matrix

# Country-grouping (shared). When enable=true the run is restricted to the
# countries of `group` from registry analysis/groupings/<source>.csv (cols
# iso3,group); `country` is derived automatically and random effects nest only
# country/ADM1 (the AFRO_region level is dropped, no group-level RE). Default
# off → existing single all-Africa model with full region/country/ADM1 nesting.
grouping:
  enable: false
  source: ~                 # registry name → analysis/groupings/<source>.csv
  group:  ~                 # which group this config runs (value in `group` col)

# Population crosswalk (shared). Drives the 02_*_population extraction pipeline,
# which builds H[l,g,t] = UN-adjusted WorldPop mass in the intersection of
# location-period geometry l and GADM polygon g. From H come the LP population
# P_l (the denominator of an *observation*) and the canonical gid population
# Q_g (the denominator of a *forecast unit*). Consumed only where a caller opts
# in: size.pop_source and simulator.location_frame.gid_pop_path.
# NOTE: keys here must mirror get_default_options()$population exactly —
# analysis/tests/test_config_defaults_parity.R enforces it.
population:
  crosswalk_path:   ~              # null → make_pop_run_file(opt, "pop_crosswalk")
  gid_pop_path:     ~              # null → make_pop_run_file(opt, "pop_gid")
  years:            [2015, 2030]   # inclusive; WorldPop constrained coverage
  scaling:          "un_wpp2024"   # national-total rescale outside `years`
  wpp_table:        "generated_data/wpp2024_national_totals.csv"
  raster_dir:       "data/worldpop"
  boundary_cache:   "data/country_boundaries"
  gadm_path:        "data/geodata/gadm_valid.gpkg"
  lp_shapefiles:    "~/secure/cholera_outbreak_data/outbreak_data_Nov_2026/outbreak_shapefiles.rds"  # vintage = paths.R::OUTBREAK_DATA_VINTAGE; root = CHOLERA_OUTBREAK_DATA_DIR when set
  country_registry: "analysis/groupings/enso_grouping.csv"
  sliver_mass_frac: 1.0e-4         # drop pieces below this fraction of P_l ...
  sliver_mass_min:  1.0            # ... or below this many people, whichever is larger
  reconcile_tol:    0.01           # |sum_g H - P_direct| / P_direct tolerance
  composite:
    cover_threshold: 0.90          # gid_cover below this → treated as composite
    c_min:           0.05          # drop observation-operator entries below this
    tiling:          "derived"     # derived | corpus_label — which GADM tiling an LP
                                   # is read at. "derived": the frozen `lp_level`
                                   # column written by 02c (geometry-based; see
                                   # derive_lp_tiling_level() in utils/population_core.R).
                                   # "corpus_label": the level from the outbreak
                                   # corpus's own `admin_level` string, whose admin
                                   # depth is NOT GADM's (kept for reproducibility).
    tiebreak:        "tolerant"    # strict | tolerant — passed to derive_lp_tiling_level()
                                   # as the area tie-break used when BOTH GADM levels are
                                   # population-admissible. "strict": bare
                                   # acov_ADM2 >= acov_ADM1, structurally biased
                                   # toward ADM1 (75.6% of both-admissible LPs lost it,
                                   # including a ~500-LP spike with acov_ADM2 in
                                   # [0.95,1.0] that still lost). "tolerant" (default):
                                   # two-tier floor + tolerance rule.
    tiebreak_floor:  0.80          # tolerant only: acov_ADM2 above this -> ADM2 outright
    tiebreak_tol:    0.10          # tolerant only: ADM2 wins unless it trails ADM1's
                                   # acov by this much or more
  slurm:
    partition:         "public-cpu"
    time:              "04:00:00"
    mem_per_task:      "16G"       # not the house 8G: a 100m raster is 0.5-1 GB
    cpus_per_task:     1
    array_concurrency: 1000        # %K cap on concurrent array tasks (1000 = no practical cap; rasters are prestaged)
    log_dir:           "logs"

# Cross-track episode definition (shared) -- what ONE outbreak episode is, for
# all four tracks at once (utils/footprint.R::build_canonical_episodes()).
#   lp_season   historical: occurrence censors per location period and unions
#               to gid afterwards; size/duration/monthly key on
#               (gid, year_seas, admin_level) with first()-taken dates.
#   gid_season  one canonical episode per (gid, year_seas): onset = earliest
#               member TL, end = latest member TR, one geometry-derived
#               admin_level per gid. Needs the four preps run with
#               --episode_key gid_season; artefacts carry an "_ep-gs" token.
# national_zero_fill (gid_season only): read the occurrence panel prepped with
#   03_prepare_occ.R --national_zero_fill, which adds no-onset rows for the
#   national-zero months (01_preprocess_national_zero_months.R) of each gid.
#   Occurrence panel / fit / base-rate artefacts carry a "_nz" token.
# national_zero_threshold (national_zero_fill only): read the panel prepped from
#   the threshold national-zero months (01 --zero_threshold N; WHO country-years
#   under N cases count as zeros, an outbreak needing >= 50); token "_nz<N>".
#   0 = exact zeros only (the "_nz" panel).
episodes:
  key: "lp_season"
  national_zero_fill: false
  national_zero_threshold: 0
  # national_zero_fill only: named rule of analysis/national_zero_rules.yml
  # ("" = none; 03 --national_zero_rule; "_nz<N>-<rule>" panel token).
  national_zero_rule: ""
  # gid_season only: season | after_episode (03 --at_risk_start;
  # "_ae" token: rows inside an earlier season's running episode are masked).
  at_risk_start: "season"
  # gid_season only: drop | censor_orphan (03 --adm1_overlap;
  # "_a1c" token: the ADM2 children's rows inside an orphan ADM1 parent episode
  # leave the panel).
  adm1_overlap: "drop"

# ---------------------------------------------------------------------------
# OCCURRENCE MODEL BLOCK
# Presence of this key => occurrence run.
# ---------------------------------------------------------------------------
occurrence:
  backend:     "brms_cb"    # brms_cb | brms | brms_kl  → dispatcher routes on this
  admin_level: "ADM2"       # ADM1 | ADM2
  ongoing_outbreak_re: true # include RE on ongoing_outbreak_lag1

  # Baseline-rate anchor (utils/anchor.R), the occurrence analogue of size's
  # offset_meanrate. FALSE keeps every pre-existing config bit-inert: no
  # base_rate_occ column, no offset(log(base_rate_occ)) term, no sidecar path
  # token. TRUE joins the EB-shrunk per-(country, admin_level) rate table and
  # switches the Intercept prior to brms.prior_intercept_anchored, because the
  # anchor's denominator is exactly the other offset (exposure days), so the
  # intercept then sits on a residual scale where exp(Intercept) ~ 1.
  offset_baserate: false     # offset(log(base_rate_occ))

  # Re-key admin_level from the geometry-derived GADM level (gid_population
  # table) before the admin-level row filter, as size/monthly do. ~ = corpus
  # labels. See size.canonical_admin_level.
  canonical_admin_level: ~

  # time_to_last_outbreak + level "none" (no recorded prior onset), a load-time
  # recode appended after "[6,Inf]"; fit-name token "_ttn".
  ttlo_no_prior_level: false

  # Convention-2 escape hatch: fixed-effects-without-slope + toggles.
  # Climate covariates (mean_precip, dev_precip, ...) are NOT listed here;
  # they are implied by active slope RE flags in random_effects below.
  covariates:
    time_to_last_outbreak_cat: true    # categorical factor (current default)
    ongoing_outbreak_lag1:          true    # boolean, lag-1 (current default)
    ongoing_outbreak_country_lag1:  true    # boolean, country-level spillover lag-1
    ongoing_outbreak_tu_lag1:       true    # boolean, TU-level spillover lag-1
    # Distance-weighted neighbour contagion: adds
    # nbr_lag1_r{contagion.rho_km}[_rn] as a FE. false is load-bearing —
    # make_occ_run_file()'s nbr_token is gated on it, so leaving it false keeps
    # every pre-existing config's artefact names byte-identical.
    nbr_contagion_lag1:             false   # include nbr_lag1_r{contagion.rho_km} as FE
    enso:                           false   # include enso_lag{enso.lag_months} as FE
    months:                    false   # factor(1..12) — calendar fixed effect
    quarter:                   false   # factor(1..4)

  # Random-effect structure flags.
  # Convention 2: re_adm1_<cov>_slope = TRUE implies <cov> as fixed effect.
  # build_formula_terms() uses resolve_slopes() to decode flags by regex, so
  # any re_adm1_<col>_slope flag added here is automatically wired — no need
  # to edit the formula builder. Only active (TRUE) flags are listed; all
  # others default to false/absent (non-load-bearing under the regex resolver).
  # Intercepts and special slopes (ttlo, ongoing, basehaz) do NOT imply a FE.
  random_effects:
    re_region_country_adm1_intercept:  true   # (1 | AFRO_region/country/ADM1)
    re_region_country_ttlo_slope:       true   # time_to_last_outbreak at region+country
    re_adm1_mean_precip_slope:          true   # implies mean_precip FE
    re_adm1_dev_precip_slope:           true   # implies dev_precip FE
    re_adm1_mean_temp_daymean_slope:    true   # implies mean_temp_daymean FE
    re_adm1_dev_temp_daymean_slope:     true   # implies dev_temp_daymean FE
    re_region_country_ongoing_slope:         true   # ongoing_outbreak_lag1 at region+country
    re_region_country_ongoing_country_slope: true   # ongoing_outbreak_country_lag1 at region+country
    re_region_country_ongoing_tu_slope:      true   # ongoing_outbreak_tu_lag1 at region+country
    re_adm2_intercept:                       false  # iid intercept at ADM2 nested within ADM1
    re_region_country_basehaz_slope:    false  # group-varying seasonality (factor basehaz only)
    # Neighbour-contagion slope REs (require covariates.nbr_contagion_lag1: true).
    # Shallow/deep split like the ENSO pair, except the deep flag adds ONLY the
    # ADM1 level, so setting both emits (nbr... || country) + (nbr... || country:ADM1)
    # under grouping mode with no duplicated region/country term.
    re_region_country_nbr_contagion_slope: false
    re_adm1_nbr_contagion_slope:           false
    slopes: {}                                  # granular per-level escape hatch
    # Available re_adm1_<col>_slope tokens (all default false; add as needed):
    #   Precipitation:
    #     mean_precip_lag1, mean_max_precip, mean_max_precip_lag1,
    #     mean_mean_cum7, mean_mean_cum7_lag1, mean_max_cum7, mean_max_cum7_lag1,
    #     dev_precip_lag1, dev_max_precip, dev_max_precip_lag1,
    #     dev_mean_cum7, dev_mean_cum7_lag1, dev_max_cum7, dev_max_cum7_lag1
    #   Temperature:
    #     mean_temp_daymean_lag1, mean_temp_daymax, mean_temp_daymax_lag1,
    #     mean_temp_daymin, mean_temp_daymin_lag1,
    #     dev_temp_daymean_lag1, dev_temp_daymax, dev_temp_daymax_lag1,
    #     dev_temp_daymin, dev_temp_daymin_lag1
    # ENSO slope tokens (require covariates.enso: true):
    #   re_region_country_enso_lag<N>_slope, re_adm1_enso_lag<N>_slope

  # --- DLNM crossbasis sub-block ---
  # enable: set true in run configs and specify variables: block.
  # Each variable in the variables: map inherits defaults: and may override
  # per-variable keys (max_lag, argvar, arglag, keep_linear_term, re_adm1_slope,
  # single_lag).
  # Special variable stem "enso" reuses the pre-built enso_lag* columns from
  # join_enso_lags() (no season-boundary reset).  All other stems are climate
  # covariates built with season-aware lagging (boundary cells → 0).
  dlnm:
    enable: false
    defaults:
      max_lag: 3
      argvar: {fun: bs, degree: 3, df: 4}
      arglag: {fun: ns, df: 3}
      keep_linear_term: false   # drop the matching linear FE+RE (avoid lag-0 double-count)
      re_adm1_slope: false      # opt-in random slopes on CB columns. When true, slopes
                                # are hierarchical (nested region/country/ADM1 variance
                                # components, partial pooling at each level) — the same
                                # plumbing used for non-CB slopes.
      single_lag: ~             # null = full distributed-lag crossbasis.
                                # Integer L = collapse the lag dimension to a single
                                # lag: build dlnm::onebasis on <var>_lag<L> (keeps the
                                # non-linear argvar exposure-response; arglag/max_lag
                                # unused).  Used for the per-lag ENSO comparison sweep.
      lags: ~                   # null = off.  [a, b] = every lag a..b (negative = ENSO
                                # lead) on ONE shared onebasis (knots pooled over the
                                # lags), columns <var>_cb<j>_l<lag>.  Used by the
                                # brms_kl lag-kernel backend; exclusive with single_lag.
    variables: {}               # named map of variable specs; empty = CB disabled

  # --- Gaussian lag kernel + latent classes (backend: brms_kl) ---
  # ENSO term = sum_l w_l(kmu, ksd) * f(ENSO at lag l), w = normalised Gaussian in
  # lag over the dlnm `lags:` range, f = the shared onebasis. classes >= 2 fits K
  # latent country classes, each with its own (kmu, ksd, f), marginalised at
  # country level. Sampled from a patched brms Stan program (utils/dlnm_kernel.R).
  kernel:
    cen: 0                      # reference exposure for the exposure-response summary
    sigma_lb: 0.3               # lower bound on the kernel width (lags)
    prior_mu: ~                 # null = uniform over the lag range; number = normal mean
    prior_mu_sd: 3              # sd of the kmu prior (also per class under prior_grouping)
    prior_sigma_sd: 2           # half-normal sd on ksd (truncated at sigma_lb)
    prior_beta_sd: 0.5          # normal sd on the basis coefficients
    classes: 1                  # K; 1 = single kernel, >= 2 = latent classes
    form: gaussian              # gaussian = Gaussian lag kernel (kmu, ksd) x exposure curve;
                                # dlnm = class lag basis (B-spline, lag_df) x exposure basis, linear
                                # in its coefficients, with a lag_prior (no kernel centre to get stuck);
                                # discrete = Gaussian kernels on grid centres, class centres ordered
                                # (ties allowed) and summed out exactly (see discrete:)
    lag_df: 10                  # dlnm: cubic B-spline lag-basis functions over the lag range (knots ~3 lags
                                # apart over -11..11; 7 gave ~11-lag-wide windows that could not localise)
    lag_prior: horseshoe        # dlnm: horseshoe (regularised group horseshoe per lag window) | normal
    hs:                         # dlnm horseshoe: half-Cauchy global scale per class; slab caps active windows
      scale_global: 0.1
      slab_scale: 1
      slab_df: 4
    discrete:                   # form discrete only
      widths: [0]               # kernel widths (lags), shared, summed out; 0 (default) = each class one single lag
      centre_step: 1            # candidate centres = every centre_step-th lag of the grid
      combo_prior: exchangeable # exchangeable (log K!/prod n_i!: iid uniform centres, ties not favoured) | uniform
    pin:                        # form discrete: pin classes to lag positions by seed countries, one run per
                                # order of the prior groups, combined by stacking (utils/dlnm_kernel.R kl_pin_run)
      enable: false
      seeds_n: 1                # seeds per group: its n countries with most events ...
      seeds: ~                  # ... unless given per group, e.g. {enso_east: [KEN]}
      arrangements: pilot       # pilot = most probable group orders | all = every permutation
      order_source: pilot       # where the group lag distributions for the orders come from:
                                # pilot = one single-class fit per group | sweep = an existing
                                # single-lag sweep's LOO ranking per group (weights exp(elpd - max))
      sweep_batch: ~            # sweep: batch name, e.g. prod_run_occ_grouped_enso_singlelag
                                # (null = prior_grouping.deploy_config's fits.occ_dir)
      sweep_outdir: generated_data/   # sweep: root of loo_compare/<batch>/
      cover: 0.95               # pilot: keep orders up to this cumulative probability ...
      max_runs: 6               # ... and at most this many
      parallel_runs: 2          # arrangement runs at a time (each uses its chains' cores)
      pilot:                    # MCMC of the per-group single-class pilots
        chains: 2
        warmup: 200
        sampling: 200
    ksd_fixed: ~                # form gaussian: fix every class kernel width at this many lags (null = sampled)
    seeds:                      # identify seed: the seed countries fixed to their prior group's class
      per_group: 1              # per group, its countries with most events (this many) ...
      iso3: ~                   # ... unless given per group, e.g. {enso_east: [KEN]}
    sweep:                      # init sweep: centres start at the group's lag modes in this sweep's LOO
      batch: ~                  # e.g. prod_run_occ_grouped_enso_singlelag
      outdir: generated_data/   # root of loo_compare/<batch>/
    grainsize: 1                # reduce_sum grainsize (countries) when brms_kl.threads_per_chain > 1
    grainsize_rows: 1           # reduce_sum grainsize (rows) for the countries split by rows
    split_big: true             # threaded path: split countries above N / (2 threads) rows by rows (one
                                # reduce_sum per class), so the largest country (NGA, 26%) does not cap it
    pair_collapse: true         # threaded / random-slope path: sum the Poisson likelihood per (month, ADM1)
                                # pair (exp(kernel) x sum of exp(lin) over the pair's rows; same model,
                                # no row split); false = the per-row path (split_big, grainsize_rows)
    re_slope:                   # forms discrete / gaussian: country + ADM1 deviations of the J exposure coefficients
                                # (added to the class's, applied at the class's lag; as brms_cb's
                                # dlnm re_adm1_slope on the single-lag basis)
      enable: false
      country: true             # false = ADM1 deviations only (country-level ENSO response then has to
                                # come from class membership, which it otherwise competes with)
      adm1: true                # false = country deviations only (no ADM1 deviations of the ENSO
                                # coefficients; the linear part's ADM1 REs are unaffected)
      sd_country: 0.35         # half-normal sd of the country deviation sds
      sd_adm1: 0.35             # half-normal sd of the ADM1 deviation sds
      sd_country_fixed: ~       # number = country deviation sd fixed at this value (not estimated)
    init_mu: ~                  # init given: starting centre (lag) per class label, e.g. {enso_east: 0}
    engine: stan                # stan = patched vectorised program (any K); brms = brms
                                # non-linear formula (single kernel only; slow cross-check)
    identify: auto              # label identification: auto (lagorder for form discrete, relabel for dlnm;
                                # else anchor with prior_grouping, else kmu) |
                                # kmu (ordered lag centres) | anchor (kappa * prior partition) |
                                # erf (ordered log RR at erf_at vs cen; registry only names classes) |
                                # relabel (dlnm) | lagorder (discrete: ordered centres, ties by kcon) |
                                # seed (gaussian / dlnm: seed countries fix class k = prior group k; one run) |
                                # repel (gaussian: exchangeable classes, no seeds, K = classes; repulsive prior
                                # in (lag, exposure-response) space, see repel:; registry pull label-free;
                                # draws relabelled and classes named after the registry after sampling)
    repel:                      # identify repel: each class pair adds log(1 - exp(-d2 / 2)) to the prior,
                                # d2 = (lag gap / lag_scale)^2 + mean over erf_grid of (log RR gap)^2 / erf_scale^2
      enable: false             # identify seed: also add this repulsion (labels stay fixed by the seeds;
                                # fit token -rp); identify repel always repels
      lag_scale: 3              # lags
      erf_scale: 0.5            # log RR (root mean square over the grid)
      erf_grid: [-1.5, -0.75, 0.75, 1.5]   # ENSO values (vs cen) where the responses are compared
    lag_re:                     # form gaussian: a lag offset per country, shared across classes, d_c ~ normal(0, sigma),
                                # sigma ~ half-normal(0, sd); country c in class k has lag centre
                                #   scale month: kmu_k + d_c (can leave the lag window)
                                #   scale logit: lo + (hi - lo) inv_logit(logit((kmu_k - lo) / (hi - lo)) + d_c), always
                                #                inside [lo, hi] (first / last lag); 1 logit unit ~ (hi - lo) / 4 lags
                                #                at the window centre (~5.5 for -11..11), fewer near the edges
      enable: false             # fit token -lre<sd> (scale month) | -lrl<sd> (scale logit)
      sd: 2.0                   # units of d_c: lags (month) | logit units (logit; sd 0.18 ~ 1 lag at the centre)
      scale: month              # month | logit
    erf_at: 1.5                 # ENSO value of the erf identification contrast
    alpha: 1                    # Dirichlet concentration on the class weights
    init: auto                  # auto (optimize under identify erf, else spread) | optimize | spread | wide | deployed | random |
                                # sweep (centres at the groups' sweep lag modes, chains split across modes) |
                                # given (centres at kernel.init_mu per class)
    init_starts: 8              # optimize: number of multi-start L-BFGS runs (best mode initialises every chain)
    drop_region: ~              # null = TRUE when classes >= 2 (classes replace AFRO_region)
    gq_row_loglik: false        # also emit row-level log_lik (large)
    keep_re_draws: false        # keep r_* draws in the saved latent-class fit
    partition_name: ~           # set = also write analysis/groupings/<name>.csv (MAP partition)
    prior_grouping:             # prior class membership (anchors class k to registry group k)
      source: ~                 # groupings registry name, e.g. enso_grouping
      kappa: ~                  # null = estimated strength; number = fixed
      kappa_prior_sd: 2         # half-normal sd on the estimated kappa
      deploy_config: ~          # deploy YAML: centre each class's kmu prior on its group's deployed lag
      membership: ~             # yes = also add the kappa * A membership pull under identify seed, or the
                                # label-free pull under identify repel (kappa = sd of group-level class
                                # logits; any K) (null/no = only under identify anchor)
      contiguity:               # soften A towards the groups of each country's neighbours (mix):
        enable: false           #   A[c, ] <- (1 - weight) * one-hot + weight * neighbour group shares
        weight: 0.5             #   (spatial.adjacency; needs anchor, or seed / repel + membership: yes)
    spatial:                    # spatially autocorrelated membership (field on class logits)
      enable: false
      prior: icar               # icar | dagar (proper DAG autoregressive; beta prior on rho)
      adjacency: country_adjacency   # analysis/groupings/<name>.csv (iso3_a,iso3_b)
      tau_prior_sd: 1           # half-normal sd on the field scale
      rho_prior: [2, 2]         # DAGAR only: beta(a, b) on the spatial dependence rho

  # --- brms backend sub-block ---
  brms:
    basehaz_poisson: "seasonal" # factor | cyclic | seasonal | ms
    sampling: 1000
    warmup:   1000
    chains:  4
    cores:   4
    refresh: ~
    # Matches size/duration's brms sampler settings (brms default is
    # adapt_delta 0.8 / max_treedepth 10).
    adapt_delta:    0.95
    max_treedepth:  12
    init:           "random"    # random | 0
    re_init_r:      ~           # null → Stan default; numeric r → Uniform(-r,r)
    re_uncorrelated: false      # true → || instead of | in brms RE terms

# ---------------------------------------------------------------------------
# SIZE MODEL BLOCK
# Presence of this key => size run.
# ---------------------------------------------------------------------------
size:
  backend:         "brms"          # brms | brms_cb
  family:          "negbinomial"   # negbinomial | poisson
  link:            "log"
  admin_level:     "ADM1"          # ADM1 | ADM2
  offset_pop:      true            # offset(log(pop))
  offset_meanrate: true            # offset(log(mean_rate))

  # Size is the ONE track whose anchor offset predates this key and is on by
  # default (offset_meanrate above), so here offset_baserate is purely the
  # *prior* gate: it decides whether the Intercept uses prior_intercept or
  # prior_intercept_anchored. Keeping it FALSE means the 322 configs that pin
  # prior_intercept: "normal(-3, 1)" keep fitting the same model. Flipping it
  # is a deliberate numeric choice, never an incidental side-effect of a refactor.
  offset_baserate: false           # anchored Intercept prior (offset already on)

  # --- Declare the size estimand once ---------------------------------------
  # The size mean is mu = pop x mean_rate x exp(eta), with BOTH offsets fixed,
  # so the absolute scale lives entirely in these two denominators and the
  # likelihood never estimates it. Declaring them here, and stamping the
  # resolved block onto every downstream artefact, is what lets the gates in
  # analysis/tests/gates_estimand_coherence.R catch a *semantic* mismatch --
  # the existing provenance machinery only compares artefact digests, which
  # cannot see that the offset is a whole-gid population while mean_rate was
  # built on a reporting footprint.
  #
  #   denominator      : which population the offset(log(pop)) uses
  #                      gid       = Q, whole-admin-unit population (exogenous,
  #                                 projectable, defined for every unit)
  #                      footprint = H, summed LP reporting footprint (the
  #                                 default; selected on the outcome)
  #   rate_denominator : which population mean_rate was built on. MUST equal
  #                      `denominator` -- validated, never silently defaulted.
  #                      A mismatch is the Q x rbar^H dimensional error.
  #   underreporting_multiplier : reported-case scale. 1.0 = fit and report on
  #                      the observed scale; any under-reporting inflation is a
  #                      documented downstream step, not an offset.
  #
  # Defaults are the deployed behaviour (footprint x footprint, elasticity
  # fixed at 1), so this block is inert until a config opts in.
  estimand:
    denominator:               "footprint"   # gid | footprint
    rate_denominator:          "footprint"   # gid | footprint -- must equal `denominator`
    underreporting_multiplier: 1.0

  # Population elasticity on the size mean.
  #   fixed         : offset(log(pop)) only => beta == 1 imposed, never estimated
  #   free          : offset kept, plus a level-centred log_pop_c fixed effect,
  #                   so the coefficient reads as the departure from beta = 1
  #                   and beta = 1 recovers `fixed` exactly
  #   free_by_level : as `free`, interacted with admin_level
  # Measured on the canonical admin-level keys: beta ~ 0.30, and the two
  # canonical levels are statistically indistinguishable -- hence `free`, not
  # `free_by_level`, is the reported model.
  pop_elasticity:  "fixed"         # fixed | free | free_by_level

  # Data-quality guards on the training rows (broken/collapsed WorldPop pops).
  min_pop:         10              # drop rows with pop < this (implausibly small extraction)
  max_attack_rate: 0.10            # drop rows with suspected_cases/pop > this (impossible incidence)

  # Country x admin-level mean_rate table (build_mean_rate_table(), utils.R).
  # Resolved per-unit via a
  # provenance-tagged fallback ladder (own cell -> country/other-level ->
  # ENSO group -> global; hard error if nothing resolves). The sidecar path is
  # a pure function of outdir/min_pop/max_attack_rate/estimator (make_size_run_file
  # kind = "size_mean_rate"), so every fit config using these three values
  # resolves to the same table.
  mean_rate:
    # `pooled` (log(sum(cases)/sum(pop))) so all four brms tracks share ONE
    # estimator. occ/dur/mon cannot use `geometric` at all (0/1 responses and
    # structural zero months make per-row log(rate) -Inf). On size, pooled vs
    # geometric: frame aggregate +47.8%, absorbed by a -0.391 intercept shift;
    # ZERO cells and ZERO panel rows change fallback tier. "geometric" gives
    # the log-scale-centre table.
    estimator: "pooled"            # pooled (production default) | geometric (log-scale centre) | arithmetic
    # level_factor is the country-demeaned admin-level contrast used to
    # (a) level-adjust rows before pooling into country/group/global parents and
    # (b) re-inflate a borrowed parent rate to the target level for cells with
    # no data of their own (T2/T3/T4). It is a BORROWING device, not a model
    # term. Measured: 616/616 deployed-frame gids resolve at T1, so the
    # borrowing path never fires and removal moves the frame aggregate by 0.35%.
    # ⚠ It becomes load-bearing the moment the frame extends to gids with no
    # outbreak history (projection) -- see the comment at the estimation
    # block in provenance.R. Default true.
    level_factor: true

    # Cross the cell/group/global tables over all three admin levels, including
    # any level the data does not occupy. TRUE (default) manufactures
    # those cells out of `level_factor` -- which is what gave the phantom ADM3
    # stratum its rates, but is ALSO the fallback that lets resolve_mean_rate()
    # answer a query at a level absent from training instead of hard-failing at
    # T5 (test_mean_rate_table.R exercises exactly that path). Set FALSE
    # together with `canonical_admin_level: true`, i.e. where the absent level
    # is phantom rather than merely unobserved.
    cross_absent_levels: true

  # Resolve admin_level from the canonical `gadm_level` in
  # gid_population_<Y0>-<Y1>.qs instead of trusting the outbreak corpus label.
  # 157/616 frame gids (25.5%) and 468/1582 size rows disagree, and the
  # canonical table has NO ADM3 units at all -- so the corpus's 77 "ADM3" frame
  # gids (canonically 7 ADM1 + 70 ADM2) give the ADM3 mean_rate cells, ADM3
  # level_factor and ADM3 elasticity a phantom stratum to be estimated on.
  # admin_level is the POOLING key for mean_rate and the stratifying key for the
  # elasticity, so this is not cosmetic. Null = follow the estimand (on when
  # denominator is 'gid'); set true/false to force.
  canonical_admin_level: ~

  # Seasonal/month term (analogue to basehaz_poisson on the occurrence side)
  seasonal_term:   "none"          # none | factor_month | cyclic | harmonic2

  # Overdispersion RE: random intercepts on phi (log link).
  # constant = scalar phi (current default); other levels add (1 | group).
  phi_re: "constant"               # constant | region | region_country | region_country_adm1

  # Size-model covariate toggles — standalone (does not inherit from occurrence).
  # Leave empty {} to use only the slope-implied covariates (convention 2).
  covariates: {}

  # Random-effect toggles. Convention 2: re_adm1_<cov>_slope = TRUE implies
  # <cov> as a fixed effect. See convention comment at the top of this file.
  random_effects:
    re_region_country_adm1_intercept:  true
    re_adm1_ttlo_slope:                 true
    re_adm1_mean_precip_slope:          true
    re_adm1_dev_precip_slope:           true
    re_adm1_mean_temp_daymean_slope:    true
    re_adm1_dev_temp_daymean_slope:     true
    re_region_country_ongoing_slope:    false
    re_adm2_intercept:                  false  # iid intercept at ADM2 nested within ADM1
    # all       = historical leaf (1 | .../ADM1/ADM2) over every unit, including
    #             ADM1-only units, whose singleton leaf duplicates their own ADM1 node;
    # adm2_only = (1 | .../ADM1) + (0 + is_adm2 | ...:ADM1:gid_leaf): a leaf only on
    #             canonical-ADM2 units. Needs canonical_admin_level on.
    re_adm2_leaf_scope:                 "all"
    slopes: {}

  # --- DLNM crossbasis sub-block (size track) ---
  # Mirrors occurrence.dlnm; activated when size.backend: brms_cb and enable: true.
  # See the occurrence.dlnm comment above for the single_lag semantics.
  dlnm:
    enable: false
    defaults:
      max_lag: 3
      argvar: {fun: bs, degree: 3, df: 4}
      arglag: {fun: ns, df: 3}
      keep_linear_term: false
      re_adm1_slope: false      # opt-in hierarchical (region/country/ADM1) CB slopes
      single_lag: ~             # null = full crossbasis; integer L = onebasis at one lag
    variables: {}

  # --- brms backend sub-block ---
  brms:
    sampling:       1000
    warmup:         1000
    chains:         4
    cores:          4
    adapt_delta:    0.95
    max_treedepth:  12
    init:           0.1
    prior_b:             "normal(0, 0.5)"
    prior_intercept:     "normal(-3, 1)"
    prior_sd:            "normal(0, 0.5)"
    prior_phi_intercept: "normal(1, 1)"    # phi intercept (log scale); only used when phi_re != "constant"
    prior_phi_sd:        "normal(0, 0.5)"  # phi RE SD; only used when phi_re != "constant"

# ---------------------------------------------------------------------------
# DURATION BLOCK
# Third model track alongside occurrence and size. Discrete-time CESSATION
# hazard: one row per ACTIVE MONTH per outbreak episode, response
# y = as.integer(ended) (1 on the last active month iff the episode is not
# right-censored), fitted as Poisson with offset(log_offset) where
# log_offset = log(days of the month intersected with [TL, TR]). That is the
# Holford / Laird-Olivier equivalent of a discrete-time hazard, which is why
# the occurrence backend's offset apparatus transfers unchanged.
# Data prep: analysis/03_prepare_dur.R + analysis/utils/dur_data.R.
# ---------------------------------------------------------------------------
duration:
  backend:     "brms"            # brms
  family:      "poisson"
  link:        "log"
  # ADM1 | ADM2 = intercept-RE depth only, no row filter (historical);
  # ADM1-ADM2 = the monthly episode set (dur_data.R::duration_episode_rows()).
  admin_level: "ADM1"            # ADM1 | ADM2 | ADM1-ADM2

  # Baseline-rate anchor -- see occurrence.offset_baserate. The duration
  # denominator is pmax(exposure, 1), exactly exp(log_offset), the track's only
  # other offset. FALSE is bit-inert for every pre-existing config.
  offset_baserate: false         # offset(log(base_rate_dur))

  # Canonical admin level for duration -- see occurrence.canonical_admin_level. ~ = off.
  canonical_admin_level: ~

  # PRIMARY baseline hazard, on months-since-onset (mso) -- the cessation
  # hazard's natural clock. Measured on the prepared panel the monthly hazard
  # runs 0.0006 (mso 1) to 0.31 (mso 9+), a 492x range, so a constant-hazard
  # (geometric) duration model is not defensible: "none" is a sensitivity
  # variant, never a default.
  basehaz_duration: "factor"     # factor (mso_band) | ms | none

  # SECONDARY baseline hazard, on seasonal time (t_start_seas) -- the
  # "outbreaks end when the season ends" hypothesis. Reuses the occurrence
  # branch verbatim. Off by default; mso already carries the time axis.
  basehaz_poisson:  "none"       # none | factor | cyclic | seasonal | ms

  # Calendar-month seasonality of the cessation hazard, built as
  # monthly.seasonal_term "harmonic2" (sin/cos of the active month's calendar
  # month, annual + semi-annual; load_duration_data() builds the columns).
  # Off by default: the deployed duration fits carry no seasonal term.
  # Non-default values are encoded in the fit name ("_seas-harmonic2").
  seasonal_term: "none"          # none | harmonic2

  # mso band edges for bin_mso(). MUST end in .inf. Rebuilt from config by
  # load_duration_data() at every load, so a band sensitivity run needs no
  # re-run of 03_prepare_dur.R. All the structure is in months 1-3 (4-5, 6-8
  # and 9+ sit within noise of each other), so [1, 2, 3, 4, .inf] is the
  # natural parsimony variant. Non-default break sets are encoded into the
  # artefact name by make_duration_run_file().
  mso_breaks: [1, 2, 3, 4, 6, 9, .inf]

  # Which event resets time_to_last_outbreak in the v1 simulator kernel.
  # `onset` reproduces the occurrence track's fit-time rule
  # (03_prepare_occ.R:650); `end` matches the size track's TR-based reset
  # (03_prepare_siz.R:768-780). The two tracks genuinely disagree; `onset`
  # keeps the kernel consistent with the model whose lags it feeds.
  ttlo_reset: "onset"            # onset | end

  # Duration-model covariate toggles -- standalone (does not inherit from
  # occurrence or size). Leave empty {} to use only the slope-implied
  # covariates (convention 2).
  covariates: {}

  # Random-effect toggles. Convention 2: re_adm1_<cov>_slope = TRUE implies
  # <cov> as a fixed effect.
  random_effects:
    re_region_country_adm1_intercept:  true
    re_adm2_intercept:                  false  # needs admin_level ADM1-ADM2 (or ADM2)
    re_adm2_leaf_scope:                 "all"  # all | adm2_only -- see size.random_effects
    re_adm1_mean_precip_slope:          true
    re_adm1_dev_precip_slope:           true
    re_adm1_mean_temp_daymean_slope:    true
    re_adm1_dev_temp_daymean_slope:     true
    slopes: {}

  # --- DLNM crossbasis sub-block (duration track) ---
  # Mirrors occurrence.dlnm / size.dlnm; activated when duration.backend:
  # brms_cb and enable: true. See the occurrence.dlnm comment above for the
  # single_lag semantics (the "non-linear effect at lag N" use case).
  dlnm:
    enable: false
    defaults:
      max_lag: 3
      argvar: {fun: bs, degree: 3, df: 4}
      arglag: {fun: ns, df: 3}
      keep_linear_term: false
      re_adm1_slope: false      # opt-in hierarchical (region/country/ADM1) CB slopes
      single_lag: ~             # null = full crossbasis; integer L = onebasis at one lag
    variables: {}

  # --- brms backend sub-block ---
  brms:
    sampling:        1000
    warmup:          1000
    chains:          4
    cores:           4
    adapt_delta:     0.95
    max_treedepth:   12
    init:            "random"
    re_uncorrelated: false
    prior_b:         "normal(0, 0.5)"
    prior_intercept: "normal(0, 1.5)"
    prior_sd:        "normal(0, 2.5)"
    prior_mso_band:  ~              # own prior on the mso_band effects; null = prior_b

# ---------------------------------------------------------------------------
# MONTHLY BLOCK
# Fourth model track: per-calendar-month outbreak size (response cases_month),
# a Bayesian hierarchical version of a validated negative-binomial GAM.
# Data prep: analysis/01b_preprocess_outbreaks_monthly.R + utils/footprint.R +
# analysis/03_prepare_mon.R -> make_monthly_dat_file(opt). Offsets are pop (size's
# offset_pop key) x log_offset (duration's unconditional person-time offset,
# already on the panel as log_offset = log(pmax(exposure, 1))).
# ---------------------------------------------------------------------------
monthly:
  backend:     "brms_cb"          # brms | brms_cb   (brms_cb is the primary model)
  family:      "negbinomial"      # negbinomial | poisson      [= size]
  link:        "log"              #                            [= size]
  admin_level: "ADM1-ADM2"        # ADM1 | ADM2 | ADM1-ADM2 (slope cap + row filter)
  offset_pop:  true                # offset(log(pop))            [= size key]
  # offset(log_offset) is UNCONDITIONAL (duration's behaviour, utils/formula.R .offset_terms()):
  # log_offset = log(pmax(exposure, 1)) is already on the panel (dur_data.R:350),
  # so pop x person-days needs no new column and no new toggle.

  # Baseline-rate anchor -- see occurrence.offset_baserate. mon is the one
  # anchored track with TWO other offsets, so its denominator is their product,
  # pop * pmax(exposure, 1); that `pop` is also why the mon sidecar path carries
  # a population digest token and the occ/dur ones do not (utils/paths.R).
  offset_baserate: false          # offset(log(base_rate_mon))

  # --- Declare the monthly estimand (same apparatus as size.estimand) --------
  # mon has size's H-vs-Q problem in exactly the same shape: offset(log(pop))
  # uses the LP reporting footprint H, while the simulator replays at the whole
  # GADM unit Q, so every replayed mu is inflated by 1/coverage. The size
  # resolver is shared rather than copied (.ESTIMAND_SPEC, utils/provenance.R)
  # so the two tracks cannot drift apart.
  #
  # Read `rate_denominator` as "which population base_rate_mon was built on" --
  # mon's anchor (.mon_anchor_view(), utils/anchor.R) is the analogue of size's
  # mean_rate table. mon has no mean_rate table at all; monthly.offset_meanrate
  # is refused outright (utils/config.R).
  #
  # Defaults are the deployed mon behaviour (footprint x
  # footprint, elasticity fixed at 1), so this block is inert until a config
  # opts in.
  estimand:
    denominator:               "footprint"   # gid | footprint
    rate_denominator:          "footprint"   # gid | footprint -- must equal `denominator`
    underreporting_multiplier: 1.0

  # Population elasticity on the monthly mean -- see size.pop_elasticity for the
  # full semantics. `free` keeps offset(log(pop)) and adds a level-centred
  # log_pop_c fixed effect, so its coefficient reads as the departure from
  # beta = 1 and beta = 0 recovers `fixed` exactly.
  pop_elasticity:  "fixed"        # fixed | free | free_by_level

  # Resolve admin_level from the canonical `gadm_level` in the gid
  # population table rather than the outbreak corpus label -- see
  # size.canonical_admin_level. admin_level is the pooling key for the mon
  # anchor and the stratifying key for the elasticity centres, so this is not
  # cosmetic. Null = follow the estimand (on when denominator is 'gid').
  canonical_admin_level: ~

  seasonal_term: "harmonic2"      # none | factor_month | cyclic | harmonic2  [= size]
  phi_re: "region_country_adm1"   # constant | region | region_country | region_country_adm1  [= size]

  # Flat data-shaping key, same style as duration.mso_breaks / duration.ttlo_reset.
  # true => mon_data.R builds cases_prev / log_cases_prev and the config may add a
  # dlnm.variables.log_cases_prev smooth.
  prev_cases: false

  # Standalone, does not inherit from size/occurrence. Leave {} to use only the
  # slope-implied covariates (Convention 2). Configs set e.g.
  # {admin_level: true, enso: true} -- .resolve_fixed_covariates() (utils/formula.R)
  # passes arbitrary names through as fixed terms.
  covariates: {}

  random_effects:
    re_region_country_adm1_intercept: true
    re_adm2_intercept:                true   # leaf col = gid => (1 | .../ADM1/gid),
                                             # the GAM's s(gid, bs = "re")
    re_adm2_leaf_scope:               "all"  # all | adm2_only -- see size.random_effects
    slopes: {}

  # --- DLNM crossbasis sub-block --- (size.dlnm / duration.dlnm schema plus the
  # monthly-only re_slope_levels key)
  dlnm:
    enable: true
    defaults:
      max_lag: 3
      argvar: {fun: bs, degree: 3, df: 4}
      arglag: {fun: ns, df: 3}
      keep_linear_term: false
      re_adm1_slope: false        # opt-in hierarchical (region/country/ADM1) CB slopes
      # Which re_group_by_level() levels the CB random slopes are emitted at.
      # Monthly-only, consumed by 04_fit_mon_brms_cb.R (04_fit_mon_brms.R never
      # reads the dlnm: block; occ/siz/dur _cb keep the three-level default).
      re_slope_levels: [region, country, adm1]
      single_lag: 0                # 0 = onebasis on the bare column (mso, month_num, ...)
    variables:
      # mso drops the country:ADM1 slope level -- 4 cb columns x 2 nesting levels
      # are not identified on monthly per-ADM1 data, and tail draws of the ADM1
      # slopes blow up the simulator's per-unit mu.
      mso:  {single_lag: 0, argvar: {fun: bs, degree: 3, df: 4}, re_adm1_slope: true,
             re_slope_levels: [region, country]}
      enso: {single_lag: 4, argvar: {fun: bs, degree: 3, df: 8}, re_adm1_slope: true}

  # --- brms backend sub-block --- (byte-identical key set to size.brms)
  # No brms_cb: sub-block -- size doesn't have one either; the fit script falls
  # back with opt$monthly$brms_cb %||% opt$monthly$brms %||% list().
  brms:
    sampling:       1000
    warmup:         1000
    chains:         4
    cores:          4
    adapt_delta:    0.95
    max_treedepth:  12
    init:           0.1
    prior_b:             "normal(0, 0.5)"
    prior_intercept:     "normal(-3, 1)"
    prior_sd:            "normal(0, 0.5)"
    prior_phi_intercept: "normal(1, 1)"
    prior_phi_sd:        "normal(0, 0.5)"
# ---------------------------------------------------------------------------
# SIMULATOR BLOCK
# Presence of this key => simulator run (dispatcher: analysis/07_simulator_run.R).
# `backend` routes to the offspring runner: v1 => 07b_simulator_v1.R (pure-R
# historical replay), spatpomp => 07b_simulator_spatpomp.R (spatPomp bpfilter).
# Consumes fitted occurrence (+ optional duration / monthly case-count)
# artefacts; size is retired downstream (simulator.size_fit,
# simulator.size*, location_frame.mean_rate_table_path and any
# posterior_strategy other than "paired" are refused by config.R's
# validator). Emits per-(replicate, TU)
# partitions under outdir/sim/<run_tag>/parts/ (v1) or outdir/sim_spatpomp/...
# ---------------------------------------------------------------------------
simulator:
  backend:        v1                # v1 | spatpomp (routes the 07_simulator_run.R dispatcher)
  run_tag:        ~                 # null → derive from the config filename
  occurrence_fit: ~                 # path to fitted occurrence RDS (single-model mode)
  # Monthly case-count (`mon`) track: the kernels draw a case count at EVERY
  # active month (mu driven by months-since-onset). Requires `duration_fit` --
  # `active`/`mso` are duration-model latent states. The sole case estimand
  # (`cases_month`); the size track is retired downstream.
  monthly_fit:      ~               # path to fitted monthly-size RDS (mon_fit)
  monthly_cb_meta:  ~               # null → derived from monthly_fit by string transform
  climate_panel:  ~                 # path to climate panel RDS (required in v1: historical replay)
  # Grouped mode: load one occ (+ dur/mon) fit per group from `fits_dir` and
  # route each country to its group's draws via registry <source>.csv. Mutually
  # exclusive with the single occurrence_fit path above.
  grouping:
    enable:        false
    source:        ~               # registry name → analysis/groupings/<source>.csv
    fits_dir:      ~               # batch dir containing per-group fits
    fits_baseline: ~               # baseline token for make_run_file (default: top-level baseline)
    monthly_enable: false          # also load one mon fit per group from fits_dir
  # Step-3 rehydration sources — only consulted when the climate_panel itself
  # does not carry `min_seas` / `tu` / `pop` columns.
  location_frame:
    hmm_clusters_path:      "data/hmm_country_clusters.csv"          # TU spillover
    outbreak_metadata_path: "~/secure/cholera_outbreak_data/outbreak_metadata.rds"   # (v2 reserved); root = CHOLERA_OUTBREAK_DATA_DIR when set
    size_data_path:         "generated_data/outbreak_size_analysis_data.rds"  # pop + admin_level fallback
    # Population year of the simulator / smoothing frame: an integer year, or
    # season_year (each month's population at its cholera season year, the
    # fits' year_seas convention) | calendar_year. Read only by
    # simulator_core.R::sim_pop_year_spec().
    pop_year:               2020
  # Forward horizon, CLOSED [start, end]: every month from start to end is
  # simulated (utils/base.R::horizon_month_seq()).
  horizon:
    start: "2024-01-01"
    end:   "2034-12-31"
  n_replicates:        100
  draws_per_replicate: 1
  posterior_strategy:  "paired"     # paired only (the retired `independent` branch permuted size draws)
  seed:                ~            # null → inherits top-level seed
  scope:
    transmission_units: "all"       # "all" | list of TU labels
    countries:          "all"       # "all" | comma-separated ISO3 codes (within TUs)
    admin_level:        "ADM2"      # ADM1 | ADM2  (v1: ADM2)
    unseen_adm1:        "restrict"  # restrict | marginalise
  population:                       # read by no code; base_year != 2020 is refused
    source:    "worldpop"             # (use location_frame.pop_year instead)
    base_year: 2020
    scaling:   "un_wpp2024"
  mean_rate: "frozen"
  # Suppress ongoing_outbreak_country_lag1 (o_ct) / ongoing_outbreak_tu_lag1
  # (o_tu) state tracking AND LP contribution in all three kernels (v1,
  # spatpomp-R, spatpomp Csnippet), independent of whether the fit still
  # carries the coefficients. Default false = both tracked.
  # Own ongoing_outbreak_lag1 (o) is never affected.
  drop_country_tu_spillover: false
  # incidence_cap — monthly cases per unit <= incidence_cap x pop, applied to the
  # monthly NB mean AND to the drawn monthly case count, in every kernel: the v1
  # / forecast kernel (simulate_one_tu), both spatPomp filter kernels (R and C:
  # the mean only, the filter draws no cases) and the smoothing post-hoc draw.
  # The mon NB is heavy-tailed (shape ~0.4): without a cap the smoothing can
  # draw more cases in one month than a unit has people.
  # A number > 0; .inf disables. A finite value is part of the 07b native filter
  # cache key (`_cap-<value>`), so a cache from an uncapped run is not reused.
  incidence_cap: 0.15
  # onset_eligibility — which inactive units may draw an onset, in every kernel
  # (v1 / forecast simulate_one_tu, the spatPomp C filter, the smoothing).
  #   inactive  any unit not in a running episode (default).
  #   season    also no onset yet in the unit's current cholera season (season
  #             start min_seas), read from the u_days state (days since the last
  #             onset that reset it: recorded onsets under covariate_feed:
  #             detected) and the month-of-season covariate seas_k. Matches the
  #             occurrence fit, which keeps the first onset of each gid-season
  #             and censors the gid for the rest of the season.
  #             Needs the duration track, and refuses a frame whose min_seas was
  #             defaulted for any gid. A non-default value is part of the 07b
  #             native filter cache key (`_onset-<value>`) and of the smoothing
  #             cache identity (meta.yml `onset_eligibility`).
  onset_eligibility: inactive
  # cessation_exposure — monthly case exposure of the month an episode ends, in
  # every kernel (v1 / forecast simulate_one_tu, the spatPomp C filter, the
  # smoothing's post-hoc case draw).
  #   full  a full month (default): the cessation is drawn
  #         after the monthly mean, so the kernel cannot know the month is the
  #         last.
  #   half  the cessation is drawn before the monthly mean and a ceasing month
  #         gets half a month of exposure (on top of the onset month's half),
  #         as the monthly and duration fits' panel does (.expand_active_months():
  #         the last month's exposure ends at TR). The
  #         cessation draw still reads the post-update lags, the monthly mean
  #         the pre-update ones. A non-default value is part of the 07b native
  #         filter cache key (`_cessexp-<value>`) and of the smoothing cache
  #         identity (meta.yml `cessation_exposure`).
  cessation_exposure: full
  # Distance-weighted neighbour-contagion covariate (nbr_lag1_r<rho>) scored
  # dynamically in the v1 and spatPomp kernels: at each step the kernel
  # reconstructs the lag-1 ADM1-active vector from the `o` state already in hand,
  # applies exp(-d/rho_km) over within-partition (within-country) ADM1 centroids,
  # and adds beta_nbr * neighbour_pressure to the linear predictor. No new state
  # slot (derived from `o`) ⇒ smoothing cache does NOT rebuild.
  #   enable=false (default) OR a fit carrying no nbr_* fixed effect ⇒ ZERO
  #   contagion machinery is built or executed (no kernel matrix, no matvec, no
  #   covar column, no Csnippet emission).
  # Cross-country coupling: under partition_by=country the kernel is restricted
  # to the partition's own ADM1 units (within-country only). Under
  # partition_by=enso_region the partition is the whole ENSO group, so the same
  # kernel spans member-country ADM1 units across borders — this is how region
  # mode carries cross-country coupling.
  nbr_contagion:
    enable:    false
    rho_km:    500               # decay bandwidth (km); must match the fit's nbr_lag1_r<rho> column
    gadm_path: "data/geodata/gadm_valid.gpkg"
    cache_dir: "generated_data/"
  # Forecast-phase posterior-draw handling (07b_simulator_spatpomp.R forecast
  # handoff only).
  forecast:
    # param_draw_mode — how each forecast replicate picks its posterior draw.
    #   random    = (default) draw a FRESH random index per replicate, seeded
    #     chunk-safely (invariant to SLURM replicate-chunking) and, under an
    #     enso_region partition, shared across all member countries' units.
    #   cycle     = assign each replicate a distinct draw cycling 1..S over the
    #     full bundle (deterministic posterior-parameter spread).
    #   inherited = each replicate reuses its handoff particle's posterior draw
    #     index; collapses to one draw when the smoothing cache was built with
    #     n_draws_in_filter: 1.
    #   joint     = replicate r starts from smoothing replicate
    #     j(r) = ((r - 1) mod nrep) + 1 (by rep_id) and runs the draw that
    #     replicate was reconstructed under: state and parameters are one joint
    #     posterior draw. Needs filter.smoothing_input built with
    #     filter.draw_design shared_cycle under the same max_draws, and
    #     handoff_weighting uniform; handoff_map.csv gains smoothing_draw.
    # Cross-track pairing (size/dur/mon wrap off occ) is kept in every mode.
    param_draw_mode: random
    # spread_param_draws — alias, honoured only when
    #   param_draw_mode is blank/unset: true -> "cycle", false -> "inherited".
    spread_param_draws: false
    # handoff_weighting — how each forecast replicate picks its starting state
    # among the smoothing replicates (spatpomp_core.R::select_handoff_warmup()).
    #   uniform = (default) every smoothing replicate counts
    #     equally; replicate id r takes smoothing replicate ((r - 1) mod m) + 1,
    #     so the same id starts from the same state in every arm.
    #   shuffled = balanced too, but each block of m consecutive ids takes a
    #     permutation of 1..m seeded by (simulator.seed, block): every state is
    #     used once per block, chunk-safe and shared by arms with the same
    #     seed. Use it with param_draw_mode cycle when max_draws shares a factor
    #     with m (under uniform, 200 draws x 100 states ties each draw to one
    #     state).
    #   loglik  = SIR resampling by exp(logLik). The replicates' whole-period
    #     logLiks differ by thousands of log units, so the ESS is ~1: every
    #     forecast replicate starts from one smoothing replicate.
    handoff_weighting: uniform
    # observed_active_handoff — DIAGNOSTIC, hindcast-only. Not valid for a
    # true (out-of-sample) forecast.
    # false = the forecast IC's active/mso come from the smoothed handoff state
    #   (default). When the smoothing distribution under-recruits active
    #   units at launch (e.g. ~4.6 smoothed vs ~16 observed for NGA), the
    #   ensemble starts cold and has to rebuild the self-exciting ignition ramp.
    # true = overwrite each handoff mini-panel's active/mso with the OBSERVED
    #   active footprint at the launch month (= handoff - 1 month), read from the
    #   Phase-1 duration panel (outbreaks_duration_data_base-<baseline>.rds; one
    #   row per observed active (gid, month), carrying mso). Anchoring to the
    #   known observed active set isolates the "handoff recruitment deficit" from
    #   the "forecast-ramp deficit" as an OFF/ON diagnostic.
    observed_active_handoff: false
  # ---------------------------------------------------------------------------
  # VALIDATION sub-block (07c_simulator_postprocess.R --validate / --hindcast).
  # Scoring-phase options; no effect on a forward simulation.
  # ---------------------------------------------------------------------------
  validation:
    # total_case_basis — how the total-case CRPS scorer (metric 2b,
    # compute_crps_total_cases) reconciles the observed corpus against the
    # simulator's forecast footprint before comparing region/country/Africa
    # totals.
    #   exact_gid  = default. Observed reports are kept only on an
    #     exact frame gid (`gid %in% frame$gid`) and masked on (gid, month). The
    #     simulator forecasts one admin level per region (ADM2 where nested
    #     children exist, coarse ADM1 only where they don't —
    #     drop_overlapping_adm1_from_frame), but the observed corpus reports the SAME
    #     geography at a mix of ADM1/ADM2/ADM3. So a coarse observed report whose
    #     gid is not itself a frame gid is silently dropped — the cross-level
    #     resolution blindspot. For NGA this zeroed ~40% of in-window observed case mass.
    #   region_key = footprint-reconciled. Map every gid to its ADM1
    #     region (ISO3 prefix makes "NGA_20" globally unique); keep observed
    #     reports whose region the sim forecasts; dedupe observed to the finest
    #     admin level present (apply_admin_level_filter, unchanged); mask on
    #     (region_key, month). Recovers the coarse-reported observed mass the
    #     exact-gid join drops. Mirrors notebooks/hindcast_skill.qmd §4d.
    #     Geo attribution then comes from the observed metadata's own
    #     country/AFRO_region (a coarse gid is absent from the frame).
    total_case_basis: exact_gid
  # ---------------------------------------------------------------------------
  # FILTER sub-block (spatPomp bpfilter — 07b_simulator_spatpomp.R only)
  # Block particle filter warmup.
  #
  # Values = the effective runtime defaults (get_default_options()$simulator$filter,
  # i.e. the consumers' `%||%` fallbacks). The
  # deploy templates (configs/sim_templates/*.yml + the deploy YAML's sim:
  # overlay) spell out what a run uses.
  # ---------------------------------------------------------------------------
  filter:
    enable:            false           # set true to activate bpfilter warmup
    Np:                2000            # particles per block, 07b forecast (08 smoothing: 25000 unless its config sets Np)
    block_granularity: country         # country (default) | adm1
    partition_by:      transmission_unit  # top-level partition unit: transmission_unit (default) | country | enso_region | registry
                                          # country: each country is an independent partition (finer
                                          # parallelism); internal tu indicator collapsed to 1 so the
                                          # cross-country o_tu spillover term resolves to 0.
                                          # enso_region: each ENSO fit group (simulator.grouping.source) is one
                                          # partition spanning all member-country ADM1 units, so the ADM1
                                          # neighbour-contagion kernel couples across country borders within
                                          # the region. Smoothing may run per region (native cache
                                          # hist_filter_tu=<group>_Np=*.qs) or per country, in which case the
                                          # forecast handoff IC is ASSEMBLED from the per-country caches.
                                          # Requires simulator.grouping.enable: true.
                                          # registry: each group of the country-level registry
                                          # analysis/groupings/<partition_source>.csv is one partition,
                                          # independent of the fit grouping -- a partition may mix fit groups
                                          # (every unit keeps its own group's draws, cb_meta and lag). Same
                                          # native-or-assembled handoff as enso_region.
    partition_source:  ""                 # registry name for partition_by: registry (ignored otherwise)
    # Filter window, HALF-OPEN [start, end): end = the handoff month, which the
    # forward arm simulates (utils/base.R::filter_window_months()).
    warmup_window:
      start: "2021-07-01"             # filter window start (obs against which we weight)
      end:   "2023-05-01"             # filter window end, excluded (= forecast horizon start)
    # The forward horizon, CLOSED [start, end] like simulator.horizon. Unset (~)
    # by default: 07b derives it as warmup_window.end .. horizon.end; 08
    # smoothing keeps its own 2010-01-01 .. 2023-12-01. When set, start must
    # equal warmup_window.end (and horizon.start for a forecast arm) and end
    # must equal horizon.end (sim_io.R::assert_arm_launch()).
    forecast_window:   ~
    measurement:       occurrence_duration_mon_NB  # occurrence_bernoulli | ... | occurrence_duration_mon_NB_state_detect_act
    n_draws_in_filter: 1              # S subset for draw_idx (memory bound); 1 with the fixed-draw design
    # draw_design — the posterior draw of each smoothing
    # replicate (spatpomp_core.R::smoothing_draw_idx(); 08 and 07b's native filter).
    #   per_tu_random = (default) per unit, at random with replacement, seeded by
    #     (seed, unit): replicate j runs different draws in different units.
    #   shared_cycle  = replicate j runs draw j in every unit; needs
    #     simulator.max_draws == simulator.n_replicates. Recorded in the cache's
    #     meta.yml; required by forecast.param_draw_mode joint.
    draw_design:       per_tu_random
    # When set, skip the Phase-A bpfilter and instead load an existing smoothing
    # distribution produced by the 08a/08b/08c_smoothing_*.R pipeline.
    # Path to the smoothing cache DIRECTORY (generated_data/sim_spatpomp/<run_tag>/cache).
    # 08 globs per-TU hist_filter_tu=<tu>_*.qs files; the forecast handoff date is
    # auto-derived from each trajectory's filt_months (last month + 1).
    smoothing_input:   ~
    # Surveillance detection-error rates for the `*_state_detect` measurements
    # (occurrence_bernoulli_state_detect,
    # occurrence_duration_mon_NB_state_detect); inert for every non-detect
    # measurement.
    delta_fn:          0.10            # P(obs_Y = 0 | Yout = 1) — surveillance miss rate
    delta_fp:          0.05            # P(obs_Y = 1 | Yout = 0) — false-alarm rate
    # Inactive-state case term of the `_actn` measurements: a unit
    # with no running episode reports no count with probability 1 - eps, else
    # NB(count; mu_0, phi), so the term sums to 1 for every phi. eps = 1.0 is the
    # plain floor NB (the panel estimate of eps is 0 by construction). Inert
    # for every other measurement.
    case_fp_rate:      1.0             # eps, in (0, 1]
    case_fp_mean:      0.1             # mu_0, the floor mean (as the `_act` floor)
    # Which activity field the kernel's spillover covariates (o, o_ct, o_tu, nbr,
    # time_to_last_outbreak) are built from. "latent" (default) or
    # "detected": a per-episode detection flag drawn at onset with P = 1 - delta_fn
    # (monthly false alarms at delta_fp), matching how the occurrence fit built
    # them from RECORDED episodes. Needs the duration track. Adds one state slot
    # (`det`), so its smoothing caches carry the sv12 token.
    covariate_feed:    latent          # latent | detected
    # Observed monthly case counts in the filter's obs table (obs_CM), from
    # 03_prepare_mon.R's frame. "zero_filled" also writes 0 at every non-onset
    # survival-panel month with no case row, which is what lets the `_act`
    # measurement penalise a latent episode that never ceases.
    monthly_case_obs:  none            # none | observed | zero_filled
    # How the bpfilter keeps the particles it needs for the smoothed trajectory
    # (filter_traj; 08 smoothing and the 07b native filter). full = spatPomp's
    # own bpfilter: every resampled particle of every month and block is kept
    # to the end, ~ months x state vars x Np x 8 bytes (~90 GB for a large
    # partition at Np = 10000). pruned = a copy of spatPomp 1.1.0's
    # bpfilter.internal that drops, every traj_prune_every months, the stored
    # particles with no descendant in the current population; same seed =>
    # identical() trajectory and logLik to full. pruned_float32 = pruned with
    # the kept states stored as float32 (needs the `float` package); integer
    # states exact, p / mu within ~1e-7 relative, logLik identical.
    traj_storage:      pruned          # full | pruned | pruned_float32
    traj_prune_every:  1               # months between ancestry prunes (pruned modes)
    # WHO dashboard national monthly counts (03_prepare_who_monthly.R) as a
    # country-level observation, scored against each particle's SIMULATED case
    # count summed over the country's gids and scaled to the national total by
    # 1 / (covered population share). Needs measurement
    # occurrence_duration_mon_NB_state_detect_act_who (and vice versa) and
    # block_granularity: country, so each country's term enters one bpfilter
    # block exactly once. Only complete months in [start, end) are scored.
    who_obs:
      enable:            false
      path:              generated_data/who_dashboard_monthly_africa.rds
      start:             "2023-01-01"    # first month scored (complete months only)
      end:               "2025-01-01"    # exclusive; WHO data used through 2024-12
      phi:               5               # NB size of the reporting error (process noise is in the simulated count)
      mu_floor:          1               # national-scale mean used when the country simulates 0 cases
      fp_rate:           1.0             # `_actn_who` only: eps of the country-inactive mixture (1.0 = the `_who` floor NB)
      scale:             1               # reporting multiplier on the simulated national count
      block_share:       pop             # pop | equal: per-unit share of the country term (sums to 1)
      allow_adm1_blocks: false           # true = tempered split across ADM1 blocks (sensitivity only; warns)
      # Per-country scale. fixed = multiplier scale / who_f; estimated = scale_c calibrated per country on the months
      # the WHO table and the database both observe in [scale_est.start,
      # scale_est.end) (who_dashboard.R::estimate_who_scale()): scale_c = (W_c +
      # shrink_cases * s0) / (D_c / who_f_c + shrink_cases), s0 the pooled ratio;
      # countries with < min_db_cases DB cases or < min_months overlap months take
      # the fallback (pooled = s0 | fixed = `scale`); clamped. Written by 08a to
      # <run>/who_scale.csv, digested into the tasks and the cache meta.yml.
      scale_mode:        fixed           # fixed | estimated
      scale_est:
        start:           "2023-01-01"
        end:             "2025-01-01"    # exclusive
        min_db_cases:    100
        min_months:      6
        shrink_cases:    0               # kappa, in extrapolated DB cases (0 = no shrinkage)
        fallback:        pooled          # pooled | fixed
        clamp:           [0.1, 10.0]
      # score_both = WHO scored in every scored month; skip_who =
      # WHO not scored in the (country, month)s the database observes.
      db_overlap:        score_both      # score_both | skip_who
  # Per-replicate ENSO forecast source for the factual branch. Counterfactual
  # scenarios are selected via enso.counterfactual.scenario (analog | lenssen).
  enso:
    forecast_source: "cfsv2"        # "cfsv2" (default, NOAA CPC ensemble) | "c3s" (PNG plume)
    cache_dir:  "generated_data/"
    cfsv2_url:  "https://www.cpc.ncep.noaa.gov/products/CFSv2/dataInd3/nino34Mon.nc"
    cfsv2_init: "latest"            # "latest" | "YYYY-MM" pin
    cfsv2_rebase: "seam"            # "seam" | "none" | numeric offset
    # Crude variance-rescale of the raw CFSv2 Nino3.4 anomaly forecast by
    # k = sd(observed ONI) / sd(raw CFSv2 members), applied BEFORE the seam
    # rebase so seam continuity is preserved. Crude fallback to
    # cfsv2_target_peak below (mutually exclusive).
    cfsv2_sd_correction: false
    # Preferred correction: rescale the raw CFSv2 Nino3.4 anomaly forecast by
    # k = target_peak / raw_peak, where raw_peak is the ensemble-mean
    # ONI-equivalent forecast peak, so the corrected forecast peaks at
    # target_peak instead of an incidental sd-ratio artefact. 2.5 matches the
    # latest CPC/IRI ENSO outlook for this event (between the 2023 event's
    # ~2.06 and the 2015-16 super-El-Nino's ~2.75). Applied BEFORE the seam
    # rebase so seam continuity is preserved; mutually exclusive with
    # cfsv2_sd_correction. Without either correction, strong El Nino CFSv2
    # issues can push the forecast far outside the fitted crossbasis boundary
    # knots (unbounded cubic extrapolation -> mu blow-up).
    # Default unset (~) = no peak correction (the loader's fallback); 2.5 is the
    # value recommended above, set per config to opt in.
    cfsv2_target_peak: ~
    # Hindcast calibration (CPC "PDF + spread correction" replica): path to the
    # RDS written by analysis/03_prepare_enso_cfsv2_calibration.R; "" = off.
    # Each member is percentile-mapped through the 1991-2020 NMME CFSv2
    # hindcasts onto the observed distribution, per start month and lead, and
    # the spread set to the corrected mean's hindcast RMSE; the unobserved
    # analysis months are anchored to the latest ONI season and the seam rebase
    # is skipped. Mutually exclusive with cfsv2_sd_correction / cfsv2_target_peak.
    cfsv2_calibration: ""
    # Observational target of the calibration: "ersst" (detrended ERSST Nino3.4,
    # the scale ONI and the fitted models use) | "oisst" (CPC's own target,
    # reproduces CPC's corrected plot).
    cfsv2_calibration_target: "ersst"
    # Hold every ENSO lag value at the fitted crossbasis boundary knots
    # (cb_meta$enso$range) before the basis is evaluated in the forward
    # simulation, as the smoothing phase already does. Off by default so earlier
    # runs reproduce; a calibrated strong-El-Nino forecast exceeds some groups'
    # upper knot, where the cubic basis would extrapolate.
    clamp_to_knots: false
    # Margin of that hold: each bound is widened by this fraction of its own
    # magnitude (upper knot 2.59 -> held above 3.24 at 0.25), so the basis
    # extrapolates linearly (natural-spline ns basis) up to 125% of the
    # training max and is held beyond. 0 = hold exactly at the knots.
    clamp_margin: 0.25
    # ENSO past the last CFSv2 target month (utils/enso.R::
    # sample_enso_cfsv2_trajectories()), reached when a unit mixing fit groups runs
    # to its longest member horizon:
    #   neutral: ONI = 0 past the span; the last span month's ONI averages the
    #            months that exist.
    #   ar1:     each replicate's member decays from its last CFSv2 value to 0,
    #            x_{t+k} = phi^k x_t (phi null = lag-1 autocorrelation of the
    #            observed raw Nino3.4 over fit_window). Clamped like CFSv2 values.
    #            Too much memory: worse than neutral from ~6 months.
    #   analog:  each replicate continues along one of the k nearest analogs of
    #            its own seam state (calendar month, ONI, 3-month tendency,
    #            ONI 6 months earlier) in the Lenssen piControl library
    #            (`library`, built by 03_prepare_enso_continuation_library.R),
    #            joined with an offset fading over `blend_months` (e-folding);
    #            at most one analog per `min_sep` months within a model (minimum
    #            months between two analog starts within one model: 24 here; the
    #            counterfactual pool's deploy.enso_counterfactual.min_sep_months
    #            is 12, which allows adjacent same-season years). Best
    #            fair CRPS at every lead in validation. Opt-in per deploy.
    #            exclude_models: piControl models left out of the search. Default
    #            CM2.1-NMME: 30 % of the library (longest run), so it supplied
    #            most analogs, and the strongest post-El-Nino cold bias of the 11
    #            models (-0.92 at 7-12 months). Leaving it out improves fair CRPS
    #            at every lead over 1982-2020 seams (7-12 months after a strong El
    #            Nino: 0.421 -> 0.379; 3 seeds). max_per_model: cap per model
    #            (.inf = none); a cap of 3-5 helped after El Nino less and hurt
    #            after La Nina.
    # legacy_seam: true keeps the series edge and the centred mean that mixes
    # a 0 into the last span month (pulling it a third of the way to neutral);
    # not with analog.
    continuation:
      method: neutral
      phi: ~
      fit_window: "1991_2020"
      legacy_seam: false
      library: generated_data/enso_continuation_library.qs
      k: 30
      blend_months: 3
      min_sep: 24
      max_per_model: .inf
      exclude_models: ["CM2.1-NMME"]
      # Seam of the analog continuation: last_cfsv2
      # (the last CFSv2 month, whose ONI is a 2-month mean) | last_full_oni (the
      # month before, the last full 3-month CFSv2 mean; the continuation then
      # fills the last CFSv2 month). Firm horizons follow it (enso_seam_month()).
      seam: last_cfsv2
    # c3s_plume: <path to PNG>      # per-config only; required when forecast_source: c3s
    #
    # --- counterfactual.analog_set (DOCUMENTATION ONLY — deliberately commented) ---
    # WARNING: `counterfactual.analog_set` is INERT as a default. get_default_options()
    # (analysis/utils/config.R, `simulator$enso`) defines the cfsv2_* / clamp keys
    # above but no `counterfactual` sub-block, so it is only ever read from a
    # per-run config, and the real fallback is the `%||%` in the loader.
    # Uncommenting the line below would therefore NOT change any default — it
    # would just look like it had.
    #
    # counterfactual:
    #   analog_set: all   # all | nina | neutral | elnino
    #
    # Effective default lives at analysis/utils/simulations.R (both the grouped and
    # non-grouped Lenssen branches): `analog_set = sim$enso$counterfactual$analog_set
    # %||% "all"`. Set names are validated against ENSO_ANALOG_SETS (analysis/utils.R)
    # and resolved to trajectory rows by enso_analog_set_rows(); labels come from
    # classify_enso_analog_sets() and are baked into the analog cache by
    # analysis/03_prepare_lenssen_analogs.R.
  scenario:
    climate: "factual"              # factual | counterfactual | ssp245 | ssp585
    enso:    "historical"
  output:
    format:               "qs"      # qs (default) | rds | parquet
    aggregate:            "adm2_month"
    keep_event_table:     true
    keep_monthly_summary: true
  overwrite: false
  parallel:
    backend:    "furrr"             # furrr | slurm
    over:       "transmission_unit"
    chunk_size: 25
    workers:    1                   # furrr only — keep low for safety; raise per machine
  slurm:                            # only when parallel.backend: slurm
    partition:         "public-cpu"
    time:              "12:00:00"   # TBD via first benchmark
    mem_per_task:      "8G"         # TBD via first benchmark
    cpus_per_task:     1            # pure R kernel; keep -c 1 to avoid BLAS oversubscription
    modules:           ["GCC/11.3.0", "OpenMPI/4.1.4", "R/4.2.1"]
    array_concurrency: 1000         # %K cap on concurrent array tasks (1000 = no practical cap)
    log_dir:           "logs/"

# ---------------------------------------------------------------------------
# Manuscript results (phases 09 postprocess + 10 figures)
# ---------------------------------------------------------------------------
# The authoritative record of the *output decisions* behind the manuscript
# figures: which ENSO analog set is the main scenario, which groups are dropped,
# the attribution thresholds, the IRR subsample size, the Figure-1 lag rule.
# Keeping them in config lets a figure be traced to the decisions behind it
# and lets the cache rule see a changed threshold.
#
# The shipped run config, analysis/configs/results/manuscript.yml, restates
# EVERY key below; analysis/tests/test_results_config_coverage.R asserts the two
# agree in both directions, so the run config is self-contained and no key is
# silently supplied from here.
#
# `redo_cache` is deliberately absent: it is an operational override, not an
# output decision, and stays a CLI-only flag on 09.
results:
  # Optional pointer to a deploy config (analysis/configs/deploy/<stem>.yml).
  # "" (default) = the results block is fully self-contained. When set to a
  # path, the overlapping inputs.* leaves are derived from that deploy block by
  # resolve_results_inputs_from_deploy() (explicit-over-inherited), and the
  # deploy path joins the 09 freshness inputs. Empty-string, not NULL, is the
  # unset sentinel (.merge_recursive cannot round-trip a NULL leaf). See
  # utils/deploy_core.R and get_default_options()$results$deploy_config.
  deploy_config: ""
  # Names of inputs.* leaves (manifest, grouping, sim_root, smoothing_parts_dir,
  # lag_loo_batch, best_lag_dir, hindcast_manifest, episode_key) that may be set explicitly to a value that
  # differs from what deploy_config derives. With deploy_config set, any other
  # explicit leaf that disagrees is refused (utils/deploy_core.R::
  # resolve_results_inputs_from_deploy()). Empty = none allowed.
  allow_overrides: []
  # Forked worker processes for 09's parallel steps: the per-group fit loads
  # (ENSO exposure-response, track parameters) and the per-run hindcast scoring.
  # Every artefact is identical for any value (09b_postprocess_results.R
  # --workers overrides it). Not a stamped block: it changes speed and memory
  # (one fit or one hindcast run per worker), never an output.
  workers: 1
  # brms_kl class-sweep comparison dir (05_fit_postprocess_kl_sweep.R output);
  # "" = the report_kl_sweep step is off. Not a stamped block (only
  # report_kl_sweep reads it; its files are that artefact's freshness inputs).
  kl_sweep_dir: ""
  # Its deployed cell (fit id, e.g. "ns5_K5"; deploy.kl_sweep.cell); with
  # kl_sweep_dir it turns on report_membership. Not a stamped block.
  kl_sweep_cell: ""
  # Past-ENSO-event attribution manifest (deploy --stage gen_events); "" = off.
  event_manifest: ""
  # Posterior interval of the attributable fraction / number (09 steps
  # af_posterior, event_af_posterior): fixed-draw runs only (param_draw_mode
  # cycle or joint). Not a stamped block (it only selects those steps).
  af_posterior: false
  # Replicates each (unit, posterior draw) needs after the explosive drop in
  # those steps (results_derive.R AF_POST_MIN_REPS). Unstamped.
  af_posterior_min_reps: 20
  # Reported simulated series: "latent" (default, pre-existing tables) or
  # "detected" (what surveillance would have recorded; needs runs simulated with
  # simulator.filter.covariate_feed: detected). results_core.R::results_select_series().
  series: "latent"
  inputs:                             # 09 only; 10 never reads a fit or a filter
    manifest:            "analysis/configs/forecast_horizons.yml"
    grouping:            "analysis/groupings/enso_grouping.csv"
    sim_root:            "generated_data/sim_spatpomp"
    # MUST stay in step with simulator.filter.smoothing_input in
    # analysis/configs/forecast_country_by_group/*.yml — Figure 3 splices this
    # smoothing arm onto the forecast arm built from those configs, so a stale
    # value silently glues two different filter runs together.
    # Run-specific: "" (unset sentinel); set in the results YAML or derived from
    # results.deploy_config. 09 refuses an unset value.
    smoothing_parts_dir: ""
    # Per-track batch prefix; the track stub is interpolated ->
    # analysis/configs/<batch>_<stub>_grouped_enso_singlelag/. `default`
    # applies to any track without its own entry (09b_postprocess_results.R's
    # LAG_LOO_DIR()). Each track's batch MUST be the one its best_lag_dir
    # archive entry was selected from. Run-specific: "" by default, as above.
    lag_loo_batch:
      default:    ""
      occurrence: ""
      duration:   ""
      monthly:    ""
    best_lag_dir:        "generated_data/enso_best_lag_fits"
    # Attribution manifest (deploy-derived from
    # deploy.outputs.forecast_attrib_manifest; --stage gen_attrib): the forecast
    # manifest with the factual arm launched at the counterfactual handoff.
    # Every attribution step (attribution's cumulative totals and ratios,
    # report_forecast's ratios and population tables, report_attrib_exposure,
    # report_attrib_metrics, af_posterior, attrib_exposure_posterior) reads its
    # factual from it; the displayed forecast stays inputs.manifest's factual.
    # "" = no attribution factual (the stitched forecast factual, as before).
    attrib_manifest:     ""
    # Skill of the analog ENSO continuation by lead (CRPSS vs climatology, method
    # "analog"; written by 03_prepare_enso_continuation_library.R --validate):
    # table S28's CRPSS at each group's longest continuation lead. "" = none.
    enso_continuation_skill: ""
    # Curated literature table T1a (ENSO-rainfall link per group), copied into
    # 09's rain_enso artefact (`mechanisms`) and printed by 11. "" = no T1a.
    enso_rain_mechanisms: "analysis/tables/enso_rain_mechanisms.yml"
    # Hindcast manifest (deploy-derived from deploy.outputs.hindcast_manifest);
    # 09 scores each listed run from its validation/metrics + merged summary.
    hindcast_manifest:   "analysis/configs/hindcast_horizons.yml"
    # Cross-track episode definition every 09/10/11 panel is read under
    # (lp_season | gid_season); deploy-derived from deploy.episodes.key and
    # copied onto the top-level episodes.key. Stamped: changing it re-derives.
    episode_key:         "lp_season"
    # national zero-fill occurrence panel ("_nz", gid_season only); deploy-derived
    # from deploy.episodes.national_zero_fill, copied onto episodes.national_zero_fill.
    episode_national_zero_fill: false
    # its threshold ("_nz<N>"); deploy-derived from deploy.episodes.national_zero_threshold.
    episode_national_zero_threshold: 0
    # its rule ("_nz<N>-<rule>"; "" = none); deploy-derived from deploy.episodes.national_zero_rule.
    episode_national_zero_rule: ""
    # the panel's at-risk start / ADM1-overlap treatment ("_ae" / "_a1c");
    # deploy-derived from deploy.episodes.{at_risk_start,adm1_overlap}.
    episode_at_risk_start: "season"
    episode_adm1_overlap: "drop"
  scope:                              # BOTH: selects what is derived AND plotted
    main_set:       "neutral"
    supp_sets:      ["all", "nina", "elnino"]
    supplementary:  false
    # Fit groups dropped from Figures 3–4; Figures 1–2 always show every group.
    # Every name must be a group of inputs.grouping (09 refuses an unknown name).
    # Empty by default.
    exclude_groups: []
    fig1_tracks:    ["occurrence", "duration", "monthly"]
    build_figures:  ["1", "2", "3", "4", "H"]   # 10 only; "H" = hindcast skill (S5 / S6: 10 --figures)
    # Hindcast skill (09 derives, 10 figure H, notebooks/hindcast_skill.qmd).
    # Headline = the fair variants; the legacy ones are always derived too.
    hindcast:
      enable:                 true
      headline_occ_reference: "loo_gid"
      headline_case_support:  "atrisk_gids"
      headline_case_skill_reference: "clim_pooled"
    # v2 (partition_by: registry) manifests: "drop" = each country only up to
    # its fit group's firm horizon; "flag" = keep later months, flagged
    # beyond_firm_horizon. No effect on v1 manifests.
    beyond_firm_horizon: "drop"
    # One Africa window for every attribution step. "legacy" =
    # two separate definitions (the Africa ribbon / forecast totals cut at the
    # earliest firm horizon; the attribution tables summing each group over its
    # own firm window). A first-of-month date = every included group over
    # [attribution start, window_end]: cells attribution_common /
    # post_fork_common (+ attribution_firm, every group cut at its firm horizon)
    # beside the legacy ones. A group whose firm horizon ends earlier is read on
    # into the simulated analog ENSO continuation, up to continuation_max_lead
    # months past its firm horizon (0 = firm only, "to_end" = to window_end);
    # max_counterfactual_winter ("YYYY/YY", "" = none) also stops each group at
    # its last month whose ONI reads (month - lag, every track) stay before the
    # DJF after that winter.
    africa:
      window_end:                "legacy"
      continuation_max_lead:     0
      max_counterfactual_winter: ""
  derivation:                         # 09 only
    smoothing_start:   "2011-01-01"
    n_irr_draws:       400
    # ENSO exposure-response lag selection: for duration/monthly, require
    # the select_best_lag() pick to be ≥ the occurrence track's pick for the same
    # group. false uses each track's own unconstrained pick.
    enforce_occ_floor: false
    # Forecast arms launching at different months (utils/sim_io.R::
    # manifest_arm_starts()): "stitch" starts Figures 3-4's window at the earlier
    # launch, the factual series taken from the smoothing up to its own launch
    # (paired by replicate through 07b's handoff_map.csv); "common_start" starts
    # it at the later launch. Equal launches give the same tables either way.
    arm_alignment: stitch
    # Paired-bootstrap resamples of report_attrib_exposure / report_attrib_metrics
    # / report_event_attrib (Monte-Carlo precision of the replicate means). 0 = no
    # bootstrap: interval columns NA, point estimates unchanged.
    attrib_boot_b: 500
    # Explosive-replicate modes every attribution cell is derived under: drop (a
    # pair is dropped when either arm's group window cases reach
    # thresholds.explosive_case_cap; conditions on the outcome, pulls AF towards
    # 0) and/or none (every pair kept). No winsor mode.
    explosive_modes: ["drop", "none"]
    # Explosive guard scope of the af_posterior steps: unit
    # drops a replicate explosive in any group from its whole simulation unit
    # (the groups of a unit keep one replicate set; Africa sums them per
    # replicate); group drops it from its group only.
    af_guard_scope: unit
    # Phase-11 "key numbers" report. Reference year for the canonical
    # gid_population join (population-covered / significant-effect-population
    # tables); K-month truncation horizon for the duration restricted-mean
    # duration (RMD) ratio.
    pop_ref_year:            2025
    # Per-capita rates (inc_ann_100k, an_per_100k): ref = pop_ref_year; window =
    # month-weighted mean population over the months each table reads.
    # "People living in" counts stay on pop_ref_year.
    rate_pop_year:           "ref"
    duration_ratio_horizon:  24
    # ONI values (vs neutral 0) the composite ADM1 IRRs, significant- and
    # ENSO-sensitive-population tables and duration RMD ratios are evaluated at.
    enso_conds:              [-2.0, -1.0, 1.0, 2.0]
    # Figure 1d's rainfall tables (rain_enso step; utils/clim_compile.R): the
    # rainfall deviation baseline, the ONI lags, the baseline mean (mm/month)
    # below which a calendar month is dropped, the minimum number of years for
    # r; and the rainy-season rule (a month is in a group's season when at
    # least season_share of its season_pop_year population lives in ADM1s where
    # it is above the ADM1's average month; ADM1s under season_min_annual_mm
    # per year have no season).
    rain_enso:
      baseline:             "1990_2019"
      lags:                 [-11, 11]
      dry_mm_month:         10
      min_n:                30
      season_share:         0.5
      season_min_annual_mm: 100
      season_pop_year:      2020
    # Supplement fig. SE (seasonality step): per ENSO group and calendar month,
    # the observed onset rate (survival panel), cessation rate (duration
    # panel) and cases per active episode-month (monthly panel) on the rows the
    # fits keep under admin_level (gid.R::apply_admin_level_filter()), against
    # rain_enso's rainfall climatology and rainy season. A month with fewer than
    # min_n events (cases: episode-months) is sparse and takes no part in the
    # peak; intervals at `interval`.
    seasonality:
      admin_level: "ADM1-ADM2"
      min_n:       5
      interval:    0.95
    # Supplement fig. WR (report_who_enso_ratio step): for the
    # countries of `groups`, the observed ratio of the target year's WHO cases
    # to the mean of the ENSO-neutral years (population-standardised; same
    # calendar months in the WHO monthly series, and year to date against full
    # years in the WHO annual report + dashboard) against the modelled ratio of
    # the smoothing to the ENSO counterfactual over their common months (ratio
    # of means, spread over smoothing replicates). Years from first_year; each
    # year's ENSO state under every year_definitions entry
    # (enso.R::ENSO_YEAR_DEFINITIONS); a target-year WHO series stopping more
    # than censor_weeks before the cut-off is censored; pseudo_count cases on
    # both sides of every ratio of means; interval = the level of the
    # bootstraps (n_boot, seed) and of the per-replicate spread.
    who_enso_ratio:
      groups:           ["enso_west"]
      year_definitions: ["annual_mean", "lag_occ", "djf_start", "djf_end"]
      first_year:       2010
      censor_weeks:     8
      pseudo_count:     1.0
      interval:         0.95
      n_boot:           2000
      seed:             20261107
    # Supplementary table of ENSO contrasts, all episodes of the analysis set vs those with at
    # least min_confirmed confirmed cases (report_confirmed_agreement): onset
    # rate ratio (quasi-Poisson over the window's months), ratio of median
    # duration and of median suspected cases per active month, El Nino and La
    # Nina vs neutral, phase = threshold phase of the onset month's ONI. A
    # confirmed contrast needs min_neutral neutral and min_phase phase onsets;
    # window "confirmed" restricts both sets to the confirmed onsets' months
    # ("full" = the whole record); boot_b location-period bootstraps (seed) at
    # level for the duration and monthly-case intervals.
    confirmed_agreement:
      min_confirmed: 1
      min_neutral:   2
      min_phase:     5
      window:        "confirmed"
      boot_b:        1000
      seed:          20261110
      level:         0.95
    # ENSO phase rule of report_smoothing's by-phase table (11's smoothing
    # table): "threshold" = monthly ONI at +/-0.5 with no persistence (legacy),
    # "episode" = the NOAA CPC episodes of the oni artefact (the runs Figures 1
    # and 3 shade). utils/enso.R::classify_enso_phase().
    enso_phase:
      smoothing: "threshold"
    # Lag averaging over the single-lag fits (09 step lag_averaging, from the 05
    # lag sidecars): Pareto-k per lag, k-robust elpd differences, stacking /
    # pseudo-BMA+ weights on every lag ("all") and on the deploy's eligible lags,
    # the stacked population ERF and IRR at enso_conds. report_min_weight: the
    # weight tables' display cut only.
    lag_averaging:
      enable:            false
      methods:           ["stacking", "pseudobma_plus"]
      lag_sets:          ["all", "eligible"]
      k_threshold:       0.7
      report_min_weight: 0.01
    # Hindcast scoring method (utils/hindcast_skill.R). Lead classes in months
    # after launch (7, 12 -> 0-7, 8-12, 13+); occurrence target grain, references
    # and CRPS estimators; case supports, references and rules.
    hindcast:
      lead_breaks:      [7, 12]
      occ_grains:       ["window", "calendar_year"]
      occ_references:   ["insample_gid", "loo_gid", "loo_gid_fullhist", "regional", "zero", "persistence"]
      occ_rules:        ["crps_emp", "crps_fair"]
      case_supports:    ["obs_positive_keys", "exact_gid", "atrisk_gids", "atrisk_keys", "footprint"]
      case_references:  ["loo_climatology", "zero", "persistence"]
      case_rules:       ["crps_raw", "crps_log1p", "pinball"]
      pinball_taus:     [0.05, 0.25, 0.5, 0.75, 0.95]
      interval_widths:  [0.5, 0.8, 0.9, 0.95, 0.99]
      reliability_bins: 10
      zero_floor:       true
      rank_seed:        42
      # Monthly and season case skill (hindcast_skill.R section 5b); off while
      # case_skill_supports is empty. Thresholds in cases per month / season.
      case_skill_supports:      []
      case_month_grains:        ["country", "adm1"]
      case_skill_references:    ["clim_pooled", "clim_launch_state", "persistence_season", "persistence_last"]
      case_skill_rules:         ["crps_raw", "crps_log1p", "twcrps"]
      case_clim_halfwidth:      1
      case_pop_scale:           "none"
      case_mask:                "none"
      case_tw_threshold_month:  50.0
      case_tw_threshold_season: 50.0
      case_season_min_ref:      5
      # Season-year bootstrap CIs on every CRPSS (0 = none); per-area summaries.
      bootstrap_n:          0
      bootstrap_seed:       20261101
      bootstrap_level:      0.95
      skill_area_summaries: false
  thresholds:                         # BOTH: 09 computes against, 10 captions
    prob_threshold: 0.50
    low_signal:     2.0
    # Phase-11 forecast threshold-population grid: population in admin units
    # with >= p chance of a >= m fractional increase/decrease, for every
    # (cutoff x magnitude) pair.
    pop_prob_cutoffs:  [0.5, 0.8, 0.95]
    pop_magnitudes:    [0.25, 0.5]
    # Phase-11 ENSO-sensitive population: ADM1 sensitive when any track's IRR
    # is beyond 1 +/- this fraction, either direction.
    sensitive_irr:     0.10
    # Phase-11 ENSO exposure tables: magnitude axis (IRR beyond 1 + m, adverse
    # or protective; 0 = any effect). The certainty axis reuses pop_prob_cutoffs.
    enso_magnitudes:   [0.0, 0.10, 0.25, 0.50]
    # report_attrib_exposure (forecast vs counterfactual): ADM1 counts when mean
    # forecast >= (1 + m) x mean counterfactual (Childs); IPCC robustness: >=
    # robust_exceed of the paired replicates beyond (1 + m) and >= robust_agree
    # with forecast > counterfactual (ties disagree).
    attrib_magnitudes: [0.25, 0.5, 1.0]
    robust_exceed:     0.66
    robust_agree:      0.80
    # report_attrib_metrics: cases_ge event threshold (the database's >= 50-case
    # outbreak convention), one-sided level of the PR bound when p0 = 0, S/N
    # emergence levels.
    pr_case_threshold: 50
    pr_alpha:          0.05
    sn_levels:         [1.0, 2.0]
    # Explosive-replicate cap of the "drop" mode (a replicate's group window
    # cases).
    explosive_case_cap: 200000.0
    # Per-gid monthly cap of the "drop" mode: a replicate with any gid of the
    # group at or above it in any window month is explosive too. .inf = none.
    explosive_gid_month_cap: .inf
    # af_posterior steps: a scope or ADM1 whose Monte-Carlo
    # noise share (mean within-draw noise / variance across draws) is not below
    # it has an unidentified posterior spread: adjusted interval NA, the pooled
    # value and raw interval kept, and in the Childs population it is reported
    # apart from the interval.
    af_noise_share_max: 0.8
  style:                              # 10 only
    out_dir:  "figures/manuscript"
    formats:  ["pdf", "png"]
    font:     "Arial"
    dpi:      600
    map_lo:   0.3
    map_hi:   3
    erf_xlim: [-2.5, 2.5]
    tables_dir: "figures/manuscript/tables"   # 11 only: one CSV per printed table
    enso_headline:                    # 11 only: headlined report_enso_exposure grid cell
      direction: "adverse"
      track:     "any_credible"
      magnitude: 0.25
      cutoff:    0.95
    attrib_headline:                  # 10 + 11: headlined report_attrib_exposure magnitude
      magnitude: 0.5
      window:    "attribution"        # headlined attribution cell (window); attribution_common with a common Africa
      explosive: "drop"               # headlined explosive mode (one of derivation.explosive_modes)
    attrib_metrics_headline:          # 11: headlined report_attrib_metrics cells
      sn_level: 1.0
      pr_event: "onset_any"
    group_labels: "registry"          # 10 + 11: registry (sidecar names) | lag (class letters by deployed occurrence lag) | centroid (sidecar centroid names, "West [GW]")
    membership_low: 0.6               # 10 + 11: p_max below which a country's class is marked uncertain
    who_enso_ratio:                   # 10 only, fig. WR: the year definition and counterfactual analogue set drawn
      year_definition: "annual_mean"
      analog_set:      "neutral"
    data_release: {                   # 11: D / T table -> supp (Supplementary Data) | github (repo data folder)
      D1: github, D2: supp, D3: github, D4: github, D5: github, D6: github,
      D7: github, D8: github, D9: github, D10: supp, D11: supp, D12: supp,
      D13: supp, D14: supp, D15: supp, D16: supp, D17: supp, D18: supp,
      D19: supp, D20: supp, D21: supp, D22: github, D23: github, D24: github,
      D25: github, D26: github, D27: github, D28: github, D29: github, D30: supp,
      D31: github, D32: github, D33: github, D34: github, D35: github, D36: github, D37: github, D38: github, D39: github, D40: github, T1: github,
      T2: github, T3: supp, T4: supp, T5: supp}
    data_release_exclude: ["D16_event_attrib_observed_adm1"]   # 11: table slugs withheld from the release (manifest: withheld)
